<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>홈페이지 관리 | AI 행정혁신 연구원</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<main>
<header>
<div><small>AI 행정혁신 연구원</small><h1>홈페이지 관리</h1><p>포트폴리오 콘텐츠를 직접 수정하고 저장합니다.</p></div>
<div class="head-links"><a href="../?edit=1" target="_blank">홈페이지 전체 편집 ↗</a><a href="../" target="_blank">홈페이지 보기 ↗</a></div>
</header>
<div class="notice"><b>현재 단계: 1인 전문가 아카이브 (v12) · 클라우드 연동</b><br>문구·이미지·콘텐츠를 직접 수정하고 <b>[저장 및 즉시 반영]</b>을 누르면 홈페이지에 바로 공개됩니다. Supabase가 연결되어 있으면 클라우드에 자동으로 동기화되며 이전 버전을 안전하게 백업합니다.</div>
<nav>
<button data-tab="dashboard" class="active">대시보드</button>
<button data-tab="profile">프로필</button>
<button data-tab="metrics">실적 수치</button>
<button data-tab="records">교육실적</button>
<button data-tab="courses">교육과정</button>
<button data-tab="assets">포트폴리오</button>
<button data-tab="kaim">KAIM</button>
<button data-tab="diagnosis">예비진단</button>
<button data-tab="book">도서</button>
<button data-tab="channels">채널/문의</button>
<button data-tab="alltext">전체 문구 편집</button>
<button data-tab="media">이미지 자료실</button>
<button data-tab="cloud">클라우드 운영</button>
</nav>
<section id="panel"></section>
<div class="actions">
<button id="save" class="publish">저장 및 즉시 반영</button>
<span id="status">아직 저장하지 않음</span>
<span class="spacer"></span>
<button id="export">JSON 백업</button>
<button id="import">JSON 불러오기</button>
<input id="importFile" type="file" accept="application/json" hidden>
<button id="previewSite">홈페이지 확인</button>
<button id="historySite">백업 이력</button>
<button id="reset">초기 데이터로 복원</button>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/cloud-cms.js"></script>
<script src="admin.js"></script>
<script src="admin-cms.js"></script>
<script src="admin-cloud.js"></script>
</body>
</html>
