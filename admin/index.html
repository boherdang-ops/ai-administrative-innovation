<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V12 CMS | 박상득 포트폴리오 관리</title><link rel="stylesheet" href="admin.css"></head><body><div id="loginGate" class="login-gate"><form id="loginForm" class="login-card"><small>PARK SANG-DEUK · V12 CMS</small><h1>관리자 로그인</h1><p>Supabase 관리자 계정으로 로그인합니다.</p><label>Supabase URL</label><input id="sbUrl" type="url" placeholder="https://xxxx.supabase.co"><label>Anon public key</label><input id="sbKey" type="password" placeholder="eyJ..."><label>이메일</label><input id="loginEmail" type="email" autocomplete="username"><label>비밀번호</label><input id="loginPassword" type="password" autocomplete="current-password"><button class="primary" type="submit">로그인</button><p id="loginStatus" class="hint"></p></form></div><main id="cmsMain" hidden><header><div><small>PARK SANG-DEUK · V12 CMS</small><h1>포트폴리오 관리</h1><p>사진·실적·과정·방법론·개발성과·연락처를 관리합니다.</p></div><div class="headlinks"><a href="../?preview=1" target="_blank">미리보기 ↗</a><a href="../" target="_blank">공개 사이트 ↗</a></div></header><div class="cloudbar"><span id="cloudStatus">Cloud 확인 중</span><button id="logout" class="add">로그아웃</button></div><div class="notice">작업 흐름: <b>수정 → 임시저장 → 미리보기 → 공개</b>. 사진은 현재 브라우저에서 바로 업로드할 수 있습니다. Supabase 연결 전에는 이 브라우저에 저장됩니다.</div><nav id="tabs"></nav><section id="panel"></section><div class="actions"><button id="saveDraft">임시저장</button><button id="preview">미리보기</button><button id="publish" class="primary">공개</button><button id="export">JSON 백업</button><label class="filebtn">JSON 불러오기<input id="import" type="file" accept="application/json" hidden></label><span id="status"></span></div></main><script src="../js/supabase-config.js"></script><script src="../js/cloud-cms.js"></script><script src="admin.js"></script></body></html>
