/* ---------- 이미지 처리 ---------- */
function loadImageFile(file) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\/(png|jpe?g|webp|gif|bmp)$/i.test(file.type)) { reject(new Error('PNG·JPG·WEBP 이미지만 올릴 수 있습니다.')); return; }
    if (file.size > 40 * 1024 * 1024) { reject(new Error('이미지가 너무 큽니다(40MB 초과).')); return; }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const w = img.naturalWidth, h = img.naturalHeight;
        const scale = Math.min(1, 1024 / Math.max(w, h));
        const cv = document.createElement('canvas');
        cv.width = Math.round(w * scale); cv.height = Math.round(h * scale);
        const g = cv.getContext('2d');
        g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);
        g.drawImage(img, 0, 0, cv.width, cv.height);
        resolve({ dataUrl: cv.toDataURL('image/jpeg', 0.85), w, h, name: file.name || '붙여넣은 이미지' });
      } catch (e) { reject(new Error('이미지를 변환하지 못했습니다.')); } finally { URL.revokeObjectURL(url); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('이미지를 읽을 수 없습니다. HEIC 등은 JPG·PNG로 변환 후 올리십시오.')); };
    img.src = url;
  });
}
async function setFrame(idx, kind, file) {
  const p = App.project;
  const c = p.cuts[idx];
  if (!c) return;
  const data = await loadImageFile(file);
  setUndo(`CUT ${idx + 1} 이미지 변경`);
  const id = uid();
  c[`${kind}Image`] = data.dataUrl; c[`${kind}Id`] = id; c[`${kind}Meta`] = { w: data.w, h: data.h, name: data.name };
  let msg = `CUT ${pad2(idx + 1)} ${kind === 'start' ? '시작' : '끝'} 프레임을 올렸습니다.`;
  const next = p.cuts[idx + 1];
  if (kind === 'end' && next) {
    if (!next.startImage || confirm(`CUT ${pad2(idx + 2)}의 시작 프레임도 이 이미지로 바꾸시겠습니까?\n(끝 프레임과 다음 컷 시작 프레임을 같게 하면 장면이 끊김 없이 이어집니다)`)) {
      next.startImage = data.dataUrl; next.startId = id; next.startMeta = { ...c.endMeta };
      msg += ` CUT ${pad2(idx + 2)} 시작 프레임으로 연결했습니다.`;
    }
  }
  if (kind === 'start' && idx > 0 && p.cuts[idx - 1].endImage && p.cuts[idx - 1].endId !== id) {
    // 앞 컷 끝 프레임과 연결이 끊김 — 점검 단계에서 참고로 알림
  }
  touch(); render();
  toast(msg, 'ok', 6000, undoToastAction());
}
function dataUrlToBlob(d) {
  const [head, b64] = d.split(',');
  const mime = head.match(/data:([^;]+)/)[1];
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
async function copyImageToClipboard(dataUrl) {
  if (!navigator.clipboard || !window.ClipboardItem) return false;
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = dataUrl; });
  const cv = document.createElement('canvas'); cv.width = img.naturalWidth; cv.height = img.naturalHeight;
  cv.getContext('2d').drawImage(img, 0, 0);
  const blob = await new Promise((res) => cv.toBlob(res, 'image/png'));
  try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); return true; } catch (e) { return false; }
}

/* ---------- Gemini 일괄 작성 ---------- */
async function runMotionBatch() {
  const p = App.project;
  const targets = p.cuts.map((c, i) => (cutStage(c) === 'needMotion' ? i : -1)).filter((i) => i >= 0);
  if (!targets.length) { toast('작성할 컷이 없습니다.'); return; }
  setUndo('모션 일괄 작성');
  const ctrl = new AbortController();
  const m = { task: 'motionBatch', phase: 'running', abort: ctrl, done: 0, total: targets.length, current: targets[0], fails: [],
    html() { return `<div class="modal-head"><h2 id="modal-title">이미지 보고 모션 일괄 작성</h2></div>
      <div class="modal-body" style="text-align:center;padding:36px 20px"><div class="spinner"></div><b>CUT ${pad2(this.current + 1)} 작성 중… (${this.done + 1}/${this.total})</b>
      <div class="help" style="margin-top:6px">컷마다 이미지를 함께 보내 순서대로 작성합니다. 모델: ${esc(App.prefs.model)}</div></div>
      <div class="modal-foot"><button class="btn" data-act="aiCancel">중단</button></div>`; } };
  openModal(m);
  let pending = 0;
  for (const i of targets) {
    if (ctrl.signal.aborted) break;
    m.current = i; renderModal();
    try {
      const text = await callGemini(buildMotionPrompt(p, i), ctrl.signal, motionImages(p.cuts[i]));
      applyMotionResult(i, extractJSON(text), true);
      if (p.cuts[i].review.decision === 'pending') pending++;
      touch();
    } catch (e) {
      if (e.code === 'abort') break;
      m.fails.push(`CUT ${pad2(i + 1)}: ${e.message.split('\n')[0]}`);
      if (['nokey', 'nomodel', 'http401', 'http403', 'http404', 'network'].includes(e.code)) { m.done++; break; }
    }
    m.done++;
  }
  App.modal = null; renderModal(); touch(); go('frames');
  const okN = m.done - m.fails.length;
  toast(`${okN}개 컷을 작성했습니다.${pending ? ` 그중 ${pending}개는 기획과 달라 선택이 필요합니다.` : ''}${m.fails.length ? `\n실패: ${m.fails.join(' / ')}` : ''}`, m.fails.length ? 'err' : 'ok', 12000, undoToastAction());
}

/* 토스트의 되돌리기 버튼은 그 토스트가 가리키는 작업일 때만 동작 */
function undoToastAction(label = '되돌리기') {

}

const ACTIONS = {
  home: () => go('home'),
  settings: () => go('settings'),
  backToProject: () => { if (App.project) go('setup'); },
  go: (el) => { if (!App.project && el.dataset.view !== 'home') return; go(el.dataset.view); },
  undo: doUndo,

  newProject: async (el) => { const p = newProject(el.dataset.mode, App.engines); App.projects.unshift(p); await DB.put(p).catch(() => {}); openProject(p, 'setup'); },
  sample: async (el) => { const p = createSample(el.dataset.mode); App.projects.unshift(p); await DB.put(p).catch(() => {}); openProject(p, 'cuts'); toast('예시 프로젝트를 만들었습니다. 자유롭게 고쳐 보십시오.'); },
  openProject: (el) => { const p = App.projects.find((x) => x.id === el.dataset.id); if (p) openProject(p); },
  dupProject: async (el) => {
    const src = App.projects.find((x) => x.id === el.dataset.id); if (!src) return;
    const p = clone(src); p.id = uid(); p.settings.title = `${p.settings.title || '제목 없음'} (사본)`; p.createdAt = p.updatedAt = Date.now();
    App.projects.unshift(p); await DB.put(p).catch(() => {}); render(); toast('프로젝트를 복제했습니다.');
  },
  backupProject: (el) => { const p = App.projects.find((x) => x.id === el.dataset.id); if (p) downloadFile(`${fileBase(p)}_project.json`, JSON.stringify(p, null, 2), 'application/json'); },
  deleteProject: async (el) => {
    const p = App.projects.find((x) => x.id === el.dataset.id); if (!p) return;
    if (!confirm(`"${p.settings.title || '제목 없음'}" 프로젝트를 삭제합니다.\n삭제하면 되돌릴 수 없습니다. 필요하면 먼저 백업하십시오.`)) return;
    await DB.remove(p.id).catch(() => {});
    App.projects = App.projects.filter((x) => x.id !== p.id);
    if (App.project && App.project.id === p.id) { App.project = null; App.undo = null; }
    render(); toast('삭제했습니다.');
  },

  setDuration: (el) => { App.project.settings.duration = num(el.dataset.sec, 30); touch(); render(); },
  addInputChar: () => { const a = App.project.input.anim; if (a.characters.length >= 3) return; a.characters.push({ id: uid(), name: '', look: '', personality: '' }); touch(); render(); },
  delInputChar: (el) => { const a = App.project.input.anim; a.characters.splice(+el.dataset.idx, 1); touch(); render(); },

  blankPlan: () => { const p = App.project; p.plan = { title: p.settings.title, coreMessage: '', hook: '', beats: [{ phase: '도입', text: '' }, { phase: '전개', text: '' }, { phase: '마무리', text: '' }], keyPoints: [], characters: p.mode === 'anim' ? p.input.anim.characters.filter((c) => c.name).map((c) => ({ id: uid(), name: c.name, fixedPrompt: '', voice: '' })) : [] }; p.basis.plan = planBasis(p); touch(); render(); },
  addItem: (el) => {
    const p = App.project; const list = getPath(p, el.dataset.list); if (!Array.isArray(list)) return;
    const tpl = { 'plan.beats': { phase: '', text: '' }, 'plan.keyPoints': { point: '', sourceQuote: '' }, 'plan.characters': { id: uid(), name: '', fixedPrompt: '', voice: '' } }[el.dataset.list];
    list.push(clone(tpl)); touch(); render();
  },
  delItem: (el) => { const list = getPath(App.project, el.dataset.list); if (!Array.isArray(list)) return; list.splice(+el.dataset.idx, 1); touch(); render(); },
  moveItem: (el) => {
    const list = getPath(App.project, el.dataset.list); const i = +el.dataset.idx; const j = i + (+el.dataset.dir);
    if (!Array.isArray(list) || j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]]; touch(); render();
  },

  blankCuts: () => { const p = App.project; const [a] = cutRange(p); p.cuts = Array.from({ length: a }, () => blankCut(p)); distributeUse(p); p.basis.cuts = cutsBasis(p); touch(); render(); },
  addCut: () => { const p = App.project; const last = p.cuts[p.cuts.length - 1]; p.cuts.push(blankCut(p, last && last.renderSec)); touch(); render(); setTimeout(() => gotoCut(p.cuts.length - 1), 20); },
  delCut: (el) => {
    const p = App.project; const i = +el.dataset.idx; const c = p.cuts[i]; if (!c) return;
    const hasContent = c.scene || c.imagePrompt.replace(p.settings.styleText, '').trim() || c.narration || c.subtitle;
    if (hasContent && !confirm(`CUT ${pad2(i + 1)}을 삭제하시겠습니까?`)) return;
    setUndo(`CUT ${i + 1} 삭제`); p.cuts.splice(i, 1); touch(); render();
    toast(`CUT ${pad2(i + 1)}을 삭제했습니다.`, '', 6000, undoToastAction());
  },
  dupCut: (el) => { const p = App.project; const i = +el.dataset.idx; const c = clone(p.cuts[i]); c.id = uid(); c.endImage = ''; c.endId = ''; c.endMeta = null; if (c.review) c.review.frameKey = frameKey(c); p.cuts.splice(i + 1, 0, c); touch(); render(); },
  moveCut: (el) => { const p = App.project; const i = +el.dataset.idx; const j = i + (+el.dataset.dir); if (j < 0 || j >= p.cuts.length) return; [p.cuts[i], p.cuts[j]] = [p.cuts[j], p.cuts[i]]; touch(); render(); },
  toggleCut: (el) => { const c = App.project.cuts[+el.dataset.idx]; if (!c) return; c.collapsed = !c.collapsed; touch(); render(); },
  collapseAll: (el) => { App.project.cuts.forEach((c) => { c.collapsed = el.dataset.val === '1'; }); touch(); render(); },
  copyField: async (el) => { const v = str(getPath(App.project, el.dataset.path)); const ok = await copyText(v); toast(ok ? '복사했습니다.' : '복사하지 못했습니다. 직접 선택하여 복사하십시오.', ok ? '' : 'err', 1800); },

  fix: (el) => {
    const id = el.dataset.fix;
    const undoable = !['ackPlan', 'ackCuts'].includes(id);
    if (undoable) setUndo('자동 수정');
    const r = applyFix(App.project, id);
    if (r.ok) { touch(); render(); toast(r.msg, 'ok', 6000, undoable ? undoToastAction() : undefined); }
    else { if (undoable) App.undo = null; toast(r.msg, 'err', 7000); }
  },
  gotoCut: (el) => gotoCut(+el.dataset.idx),
  gotoFrame: (el) => gotoFrame(+el.dataset.idx),
  copyImagePrompt: async (el) => {
    const p = App.project; const c = p.cuts[+el.dataset.idx]; if (!c) return;
    const text = finalImagePrompt(p, el.dataset.src === 'revised' && c.review ? (c.review.revisedImagePrompt || c.imagePrompt) : c.imagePrompt);
    if (!text) { toast('이미지 프롬프트가 비어 있습니다.', 'err'); return; }
    const ok = await copyText(text);
    toast(ok ? `${p.settings.ratio} 비율 표기를 포함하여 복사했습니다. 생성 도구의 비율 설정도 ${p.settings.ratio}로 맞추십시오.` : '복사하지 못했습니다.', ok ? 'ok' : 'err', 3500);
  },
  copyText: async (el) => { const ok = await copyText(el.dataset.text || ''); toast(ok ? '복사했습니다.' : '복사하지 못했습니다.', ok ? '' : 'err', 1800); },
  copyImage: async (el) => {
    const c = App.project.cuts[+el.dataset.idx]; const d = c && c[`${el.dataset.kind}Image`]; if (!d) return;
    const ok = await copyImageToClipboard(d).catch(() => false);
    toast(ok ? '이미지를 복사했습니다. 챗봇 입력창에 Ctrl+V로 붙여 넣으십시오.' : '이 브라우저에서는 이미지 복사가 지원되지 않습니다. "저장" 후 파일로 첨부하십시오.', ok ? 'ok' : 'err', 4000);
  },
  saveImage: (el) => {
    const p = App.project; const i = +el.dataset.idx; const c = p.cuts[i]; const d = c && c[`${el.dataset.kind}Image`]; if (!d) return;
    downloadFile(`${fileBase(p)}_cut${pad2(i + 1)}_${el.dataset.kind}.jpg`, dataUrlToBlob(d));
  },
  removeFrame: (el) => {
    const c = App.project.cuts[+el.dataset.idx]; const k = el.dataset.kind; if (!c) return;
    setUndo('이미지 삭제');
    c[`${k}Image`] = ''; c[`${k}Id`] = ''; c[`${k}Meta`] = null;
    touch(); render(); toast('이미지를 삭제했습니다.', '', 6000, undoToastAction());
  },
  motionDecide: (el) => {
    const p = App.project; const i = +el.dataset.idx; const c = p.cuts[i]; if (!c || !c.review) return;
    const r = c.review; const dec = el.dataset.dec;
    setUndo('이미지 검토 선택');
    if (dec === 'proceed') { proceedWithImage(c); toast(`CUT ${pad2(i + 1)}: 현재 이미지로 진행합니다. 점검 결과와 제작 지시서에 기록됩니다.`, 'ok', 6000, undoToastAction()); }
    else if (dec === 'regen') { if (r.revisedImagePrompt) c.imagePrompt = r.revisedImagePrompt; r.decision = 'regen'; toast(`CUT ${pad2(i + 1)}: 이미지 프롬프트를 수정안으로 바꿨습니다. 이미지를 다시 만들어 올리십시오.`, 'ok', 7000, undoToastAction()); }
    else if (dec === 'undoRegen') { if (r.before) c.imagePrompt = r.before.imagePrompt; r.decision = 'pending'; }
    else if (dec === 'restoreText') { if (r.before) { c.narration = r.before.narration; c.subtitle = r.before.subtitle; } toast('내레이션·자막을 기획 원문으로 되돌렸습니다.', '', 5000, undoToastAction('취소')); }
    touch(); render();
  },
  motionManual: (el) => {
    const c = App.project.cuts[+el.dataset.idx]; if (!c) return;
    const box = document.querySelector(`[data-bind="cuts.${el.dataset.idx}.motionPrompt"]`); if (box) c.motionPrompt = box.value;
    if (allowedLengths(App.project).length && !c.motionPrompt.trim()) { toast('모션 프롬프트를 먼저 입력하십시오.', 'err'); return; }
    c.review = { observed: '', match: 'match', differences: [], revisedImagePrompt: '', motionPrompt: c.motionPrompt, narration: null, subtitle: null, changeNote: '', frameKey: frameKey(c), at: Date.now(), decision: 'manual', before: null };
    touch(); render();
  },
  motionBatch: () => runMotionBatch(),

  ai: (el) => startAI(el.dataset.task, el.dataset.idx != null ? { idx: +el.dataset.idx } : {}),
  closeModal: () => closeModal(),
  modalBackdrop: (el, ev) => { if (ev.target === el && App.modal && App.modal.phase !== 'running') closeModal(); },
  aiToPaste: () => { const m = App.modal; const r = $('#recut-request'); if (r) m.request = r.value; m.phase = 'paste'; renderModal(); },
  aiRunGemini: () => { const m = App.modal; const r = $('#recut-request'); if (r) m.request = r.value; runGemini(m); },
  aiCancel: () => { const m = App.modal; if (m && m.abort) m.abort.abort(); closeModal(); },
  copyPrompt: async () => { const t = $('#prompt-area'); const ok = await copyText(t.value); if (!ok) { t.focus(); t.select(); } toast(ok ? '요청문을 복사했습니다. 챗봇에 붙여 넣으십시오.' : '자동 복사가 막혀 있습니다. 선택된 요청문을 Ctrl+C로 복사하십시오.', ok ? 'ok' : 'err', 3000); },
  aiApplyPaste: () => {
    const m = App.modal; const text = $('#paste-area').value; m.pasteText = text;
    try { applyAIResult(m, extractJSON(text)); } catch (e) { m.error = `답변을 적용하지 못했습니다.\n${e.message}`; renderModal(); }
  },

  exportSRT: () => { const p = App.project; downloadFile(`${fileBase(p)}_subtitles.srt`, buildSRT(p, 'subtitle')); },
  exportSRTNarr: () => { const p = App.project; downloadFile(`${fileBase(p)}_narration.srt`, buildSRT(p, 'narration')); },
  exportNarration: () => { const p = App.project; downloadFile(`${fileBase(p)}_narration.txt`, buildNarrationTXT(p)); },
  exportPrompts: () => { const p = App.project; downloadFile(`${fileBase(p)}_prompts.txt`, buildPromptsTXT(p)); },
  exportCSV: () => { const p = App.project; downloadFile(`${fileBase(p)}_cutsheet.csv`, buildCSV(p), 'text/csv;charset=utf-8'); },
  exportJSON: () => { const p = App.project; downloadFile(`${fileBase(p)}_project.json`, JSON.stringify(p, null, 2), 'application/json'); },
  printDoc: () => printDoc(App.project, App.prefs),

  saveKey: () => { const v = $('#api-key').value.trim(); if (!v) { toast('API 키를 입력하십시오.', 'err'); return; } Prefs.setKey(v, App.prefs.keyStore); toast('API 키를 저장했습니다.', 'ok'); render(); },
  clearKey: () => { Prefs.clearKey(); toast('API 키를 삭제했습니다.'); render(); },
  loadModels: async () => {
    const key = ($('#api-key') && $('#api-key').value.trim()) || Prefs.getKey();
    const st = $('#conn-status');
    if (!key) { toast('API 키를 먼저 입력하십시오.', 'err'); return; }
    if (st) st.textContent = '불러오는 중…';
    try { App.models = await listGeminiModels(key); render(); toast(`사용 가능한 모델 ${App.models.length}개를 불러왔습니다. 모델 ID 칸을 눌러 선택하십시오.`, 'ok'); } catch (e) { if (st) st.textContent = ''; toast(e.message || '모델 목록을 불러오지 못했습니다.', 'err', 8000); }
  },
  testConn: async () => {
    const st = $('#conn-status');
    if (st) st.textContent = '테스트 중…';
    try {
      const out = await callGemini('다음 JSON만 출력하십시오: {"ok": true}', null);
      extractJSON(out);
      if (st) st.textContent = '연결 정상';
      toast(`연결에 성공했습니다(${App.prefs.model}).`, 'ok');
    } catch (e) { if (st) st.textContent = '연결 실패'; toast(e.message, 'err', 9000); }
  },
  addEngine: () => { App.engines.push(normEngine({ id: uid(), name: '새 엔진', lengths: [5, 10] })); Prefs.saveEngines(App.engines); render(); },
  delEngine: (el) => { if (App.engines.length <= 1) { toast('엔진은 최소 1개가 필요합니다.', 'err'); return; } App.engines.splice(+el.dataset.idx, 1); Prefs.saveEngines(App.engines); render(); },
  resetEngines: () => { if (!confirm('엔진 목록을 기본값으로 되돌리시겠습니까?')) return; App.engines = clone(DEFAULT_ENGINES); Prefs.saveEngines(App.engines); render(); },
  backupAll: () => { downloadFile(`shortform_${stamp()}_all_projects.json`, JSON.stringify({ schema: `${SCHEMA}+bundle`, exportedAt: Date.now(), projects: App.projects }, null, 2), 'application/json'); },
  wipeAll: async () => {
    if (!confirm(`프로젝트 ${App.projects.length}개를 모두 삭제합니다. 되돌릴 수 없습니다.\n계속하시겠습니까?`)) return;
    await DB.clearAll().catch(() => {});
    App.projects = []; App.project = null; App.undo = null; go('home'); toast('모든 프로젝트를 삭제했습니다.');
  },
};

/* ---------- 선택 변경(바인딩 외) ---------- */
const CHANGES = {
  mode: (el) => {
    const p = App.project; if (!el.checked || p.mode === el.value) return;
    p.mode = el.value; touch(); render();
    toast(`영상 유형을 "${MODES[p.mode].label}"(으)로 바꿨습니다. 자료 입력 항목과 점검 규칙이 달라집니다.`);
  },
  engine: (el) => {
    const p = App.project; const e = App.engines.find((x) => x.id === el.value); if (!e) return;
    p.settings.engine = clone(e); if (!e.refLock8) p.settings.useRef = false; touch(); render();
  },
  stylePreset: (el) => {
    const p = App.project; const s = STYLE_PRESETS.find((x) => x.id === el.value); if (!s) return;
    p.settings.styleId = s.id; if (s.id !== 'custom') p.settings.styleText = s.text; touch(); render();
  },
};

/* ---------- 이벤트 연결 ---------- */
function bindEvents() {
  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = ACTIONS[el.dataset.act];
    if (!fn) return;
    if (el.tagName === 'A') ev.preventDefault();
    Promise.resolve().then(() => fn(el, ev)).catch((e) => { console.error(e); toast(e.message || '처리 중 오류가 발생했습니다.', 'err', 7000); });
  });
  document.addEventListener('input', (ev) => {
    const el = ev.target;
    if (el.dataset.bind) onBound(el, false);
  });
  document.addEventListener('change', (ev) => {
    const el = ev.target;
    if (el.dataset.bind) onBound(el, true);
    else if (el.dataset.change && CHANGES[el.dataset.change]) CHANGES[el.dataset.change](el);
    else if (el.dataset.pref) {
      const k = el.dataset.pref;
      App.prefs[k] = ['cps', 'sps', 'tolerance'].includes(k) ? Math.max(0, num(el.value, DEFAULT_PREFS[k])) : el.value.trim();
      Prefs.save(App.prefs);
      if (k === 'keyStore') { const key = Prefs.getKey(); if (key) Prefs.setKey(key, App.prefs.keyStore); }
      render();
    } else if (el.dataset.eng) {
      const [i, f] = el.dataset.eng.split('.');
      const e = App.engines[+i]; if (!e) return;
      if (f === 'refLock8') e.refLock8 = el.checked; else e[f] = el.value;
      App.engines[+i] = normEngine(e); Prefs.saveEngines(App.engines);
    } else if (el.dataset.file === 'frame') {
      const file = el.files && el.files[0]; el.value = '';
      if (file) setFrame(+el.dataset.idx, el.dataset.kind, file).catch((e) => toast(e.message, 'err', 6000));
    } else if (el.dataset.file) {
      const file = el.files && el.files[0]; el.value = '';
      if (!file) return;
      importProjectFile(file).then((list) => {
        if (el.dataset.file === 'importProject' && list.length === 1) { openProject(list[0]); toast(list[0].migratedFrom ? 'V6 백업을 새 형식으로 변환하여 가져왔습니다. 내용을 확인하십시오.' : '프로젝트를 가져왔습니다.', 'ok', 6000); }
        else { render(); toast(`프로젝트 ${list.length}개를 가져왔습니다.`, 'ok'); }
      }).catch((e) => toast(`가져오기 실패: ${e.message}`, 'err', 8000));
    }
  });
  document.addEventListener('dragover', (ev) => {
    const z = ev.target.closest && ev.target.closest('[data-drop]');
    if (z) { ev.preventDefault(); z.classList.add('over'); }
  });
  document.addEventListener('dragleave', (ev) => { const z = ev.target.closest && ev.target.closest('[data-drop]'); if (z) z.classList.remove('over'); });
  document.addEventListener('drop', (ev) => {
    const z = ev.target.closest && ev.target.closest('[data-drop]');
    if (!z) { if (ev.dataTransfer && ev.dataTransfer.files.length) ev.preventDefault(); return; }
    ev.preventDefault(); z.classList.remove('over');
    const file = ev.dataTransfer.files[0];
    if (file) setFrame(+z.dataset.idx, z.dataset.kind, file).catch((e) => toast(e.message, 'err', 6000));
  });
  document.addEventListener('paste', (ev) => {
    const z = document.activeElement && document.activeElement.closest && document.activeElement.closest('[data-drop]');
    if (!z) return;
    const item = Array.from((ev.clipboardData && ev.clipboardData.items) || []).find((it) => it.type.startsWith('image/'));
    if (!item) { toast('클립보드에 이미지가 없습니다.', 'err'); return; }
    ev.preventDefault();
    setFrame(+z.dataset.idx, z.dataset.kind, item.getAsFile()).catch((e) => toast(e.message, 'err', 6000));
  });
  document.addEventListener('toggle', (ev) => {
    if (ev.target.tagName === 'DETAILS' && ev.target.open) $$('textarea.autosize', ev.target).forEach(autosize);
  }, true);
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && App.modal && App.modal.phase !== 'running') closeModal();
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && App.saveTimer) flushSave(); });
  window.addEventListener('beforeunload', (ev) => { if (App.saveTimer) { flushSave(); ev.preventDefault(); ev.returnValue = ''; } });
  window.addEventListener('error', (ev) => { console.error(ev.error || ev.message); });
  window.addEventListener('unhandledrejection', (ev) => { console.error(ev.reason); });
}

/* ---------- 시작 ---------- */
async function init() {
  bindEvents();
  try {
    await DB.open();
    const raw = await DB.all();
    App.projects = [];
    for (const r of raw) {
      try { App.projects.push(normalizeProject(r, App.engines)); } catch (e) { console.warn('손상된 프로젝트를 건너뜀', e); }
    }
  } catch (e) {
    toast('저장된 프로젝트를 불러오지 못했습니다.', 'err', 6000);
  }
  render();
}
document.addEventListener('DOMContentLoaded', init);

</script>
</body>
</html>
