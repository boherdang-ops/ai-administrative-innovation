<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="공공 홍보·강의 요약·애니메이션 숏폼 영상의 구성안, 컷 시트, 생성 프롬프트, 자막을 설계하는 단일 파일 도구">
<title>AI 숏폼 기획 스튜디오</title>
<style>
:root{
  --navy:#1F3864; --blue:#2E5FA3; --blue-soft:#E8EEF7; --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#F8F9FB;
  --line:#DCE1E8; --line-strong:#C5CDD8; --text:#1B2433; --muted:#5B6576; --faint:#8A93A3;
  --err:#B42318; --err-bg:#FDECEA; --warn:#9A6200; --warn-bg:#FFF4DB; --ok:#1E7A46; --ok-bg:#E6F4EC; --info:#2E5FA3; --info-bg:#EAF1FB;
  --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",system-ui,sans-serif;
  --mono:"D2Coding",Consolas,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:14px;line-height:1.55;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.hidden{display:none!important}

/* ---------- layout ---------- */
.app{display:grid;grid-template-rows:56px 1fr;height:100vh}
.topbar{display:flex;align-items:center;gap:14px;padding:0 20px;background:var(--navy);color:#fff}
.brand{font-weight:800;letter-spacing:-.2px;font-size:15px;white-space:nowrap;cursor:pointer}
.brand small{font-weight:600;opacity:.65;margin-left:6px;font-size:11px}
.top-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.9;font-size:13px}
.top-meta{display:flex;gap:8px;align-items:center;font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.12);white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:#9FB3D1}
.pill.on .dot{background:#5FD38D}
.body{display:grid;grid-template-columns:232px 1fr;min-height:0}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-scroll{flex:1;overflow:auto;padding:14px 10px}
.side-label{font-size:11px;font-weight:700;color:var(--faint);padding:10px 10px 6px;letter-spacing:.3px}
.nav-btn{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:left;color:var(--text)}
.nav-btn:hover{background:var(--surface-2)}
.nav-btn.active{background:var(--blue-soft);color:var(--navy);font-weight:700}
.nav-num{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);flex:none}
.nav-btn.done .nav-num{background:var(--ok);border-color:var(--ok);color:#fff}
.nav-btn.stale .nav-num{background:var(--warn-bg);border-color:#E2B45A;color:var(--warn)}
.nav-btn .badge{margin-left:auto}
.side-foot{border-top:1px solid var(--line);padding:10px}
.main{overflow:auto;min-width:0}
.page{max-width:1080px;margin:0 auto;padding:26px 28px 80px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-size:22px;margin:0;letter-spacing:-.4px}
.page-head p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- components ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:18px 20px}
.card + .card{margin-top:14px}
.export-grid > .card + .card,.grid > .card + .card,.score .box{margin-top:0}
.section-title{font-size:15px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.help{color:var(--muted);font-size:12.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;line-height:1.3}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:#18305A}
.btn.accent{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.accent:hover{background:#264F8B}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--err)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:6px}
.btn.xs{padding:2px 7px;font-size:11.5px;border-radius:5px;font-weight:600}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.badge.err{background:var(--err-bg);color:var(--err);border-color:#F3C1BC}
.badge.warn{background:var(--warn-bg);color:var(--warn);border-color:#F0D28F}
.badge.ok{background:var(--ok-bg);color:var(--ok);border-color:#B7DEC6}
.badge.info{background:var(--info-bg);color:var(--info);border-color:#C4D6F0}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > label,.lbl{font-size:12.5px;font-weight:700;color:#3A4455}
.req{color:var(--err);margin-left:2px}
.input,.select,.textarea{width:100%;border:1px solid var(--line-strong);border-radius:8px;background:#fff;padding:8px 10px;outline:none;transition:border-color .12s, box-shadow .12s}
.input:focus,.select:focus,.textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(46,95,163,.15)}
.textarea{resize:vertical;min-height:64px}
.mono{font-family:var(--mono);font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.check{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--navy)}
.divider{height:1px;background:var(--line);margin:16px 0}
.notice{border-radius:8px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.notice.warn{background:var(--warn-bg);color:#6B4700;border:1px solid #F0D28F}
.notice.info{background:var(--info-bg);color:#1F4477;border:1px solid #C4D6F0}
.notice.err{background:var(--err-bg);color:#8A1C12;border:1px solid #F3C1BC}
.notice.ok{background:var(--ok-bg);color:#155C34;border:1px solid #B7DEC6}
.notice .spacer{flex:1}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty h3{color:var(--text);margin:0 0 6px;font-size:16px}
.counter{font-size:11.5px;color:var(--faint);text-align:right}
.counter.over{color:var(--err);font-weight:700}
.kbd{font-family:var(--mono);font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 5px}

/* ---------- home ---------- */
.mode-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:26px}
.mode-card{padding:18px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.mode-card h3{margin:0;font-size:16px}
.mode-card .tag{font-size:11px;font-weight:700;color:var(--blue)}
.mode-card ul{margin:0;padding-left:18px;color:var(--muted);font-size:12.5px}
.mode-card .row{margin-top:auto;padding-top:6px}
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.table th{font-size:12px;color:var(--muted);font-weight:700;background:var(--surface-2)}
.table tr:last-child td{border-bottom:0}
.table td.title-cell{font-weight:700;cursor:pointer}
.table td.title-cell:hover{color:var(--blue)}
.progress{height:6px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;width:90px}
.progress > i{display:block;height:100%;background:var(--blue)}

/* ---------- plan ---------- */
.beat{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:start;margin-bottom:8px}
.char-card{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2)}

/* ---------- cuts ---------- */
.summary-bar{position:sticky;top:0;z-index:5;background:rgba(244,246,249,.96);backdrop-filter:blur(4px);padding:10px 0 12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.stats{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:13px}
.stat b{font-size:15px}
.stat.bad b{color:var(--err)}
.stat.good b{color:var(--ok)}
.cut{border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:12px;box-shadow:var(--shadow);scroll-margin-top:90px}
.cut.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px rgba(46,95,163,.45)}100%{box-shadow:var(--shadow)}}
.cut-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);border-radius:12px 12px 0 0;flex-wrap:wrap}
.cut-no{font-weight:800;color:var(--navy);font-size:14px;min-width:54px}
.cut-head .mini{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.cut-head .mini .select,.cut-head .mini .input{padding:4px 6px;width:auto;font-size:12.5px}
.cut-head .mini .input{width:70px}
.cut-body{padding:12px 14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.cut.collapsed .cut-body{display:none}
.cut.collapsed .cut-head{border-bottom:0;border-radius:12px}
.cut-summary{flex:1;min-width:120px;color:var(--muted);font-size:12.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.prompt-field .lbl{display:flex;align-items:center;gap:6px}
.prompt-field .lbl .spacer{flex:1}
.cut .issues{padding:0 14px 12px;display:flex;gap:6px;flex-wrap:wrap}

/* ---------- frames ---------- */
.ratio-suffix{background:var(--info-bg);color:var(--info);border-radius:4px;padding:0 4px;font-size:11.5px}
.thumb{width:34px;height:34px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.frame-body{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;padding:12px 14px}
.frame-col{min-width:0;display:flex;flex-direction:column;gap:10px}
.frame-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frame-slot{display:flex;flex-direction:column;gap:5px;min-width:0}
.frame-img{height:170px;border-radius:8px;overflow:hidden;background:#1B2433;border:1px solid var(--line)}
.frame-img img{width:100%;height:100%;object-fit:contain;display:block}
.dropzone{height:170px;border:2px dashed var(--line-strong);border-radius:8px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;padding:8px;color:var(--muted);font-size:12px;cursor:pointer;outline:none}
.dropzone b{color:var(--text);font-size:13px}
.dropzone:focus{border-color:var(--blue);background:var(--blue-soft)}
.dropzone.over{border-color:var(--ok);background:var(--ok-bg)}
.plan-details summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--blue)}
.review-box{border:1px solid #F0D28F;background:#FFFBF0;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.review-box.done{border-color:var(--line);background:var(--surface-2)}
.review-box.mismatch{border-color:#F3C1BC;background:#FFF7F6}
.diff-list{margin:2px 0;padding-left:18px;font-size:12.5px}
.option-card{border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.small-pre{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:11.5px;max-height:110px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.modal-img{width:180px;display:flex;flex-direction:column;gap:4px;text-align:center}
.modal-img img{width:180px;height:130px;object-fit:contain;background:#1B2433;border-radius:6px}

/* ---------- checks ---------- */
.check-group{margin-bottom:18px}
.check-item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--line)}
.check-item:last-child{border-bottom:0}
.check-item .msg{flex:1}
.check-item .where{font-size:12px;color:var(--muted)}
.score{display:flex;gap:10px;flex-wrap:wrap}
.score .box{flex:1;min-width:120px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff}
.score .box b{font-size:22px;display:block}
.score .box.err b{color:var(--err)} .score .box.warn b{color:var(--warn)} .score .box.info b{color:var(--info)} .score .box.ok b{color:var(--ok)}

/* ---------- export ---------- */
.export-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.export-card{display:flex;flex-direction:column;gap:6px}
.export-card h3{margin:0;font-size:15px}
.export-card .row{margin-top:auto;padding-top:8px}

/* ---------- modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:14px;width:min(860px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal-head h2{margin:0;font-size:17px;flex:1}
.modal-body{padding:16px 20px;overflow:auto}
.modal-foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.step-label{display:flex;gap:8px;align-items:center;font-weight:700;margin:4px 0 8px}
.step-label .n{width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:12px}
.spinner{width:34px;height:34px;border:3px solid var(--blue-soft);border-top-color:var(--blue);border-radius:50%;animation:spin 0.9s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- toast ---------- */
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:200;max-width:min(420px,calc(100vw - 36px))}
.toast{background:#1B2433;color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;gap:10px;align-items:center;font-size:13px}
.toast.err{background:#8A1C12}
.toast.ok{background:#155C34}
.toast .btn{background:rgba(255,255,255,.15);border-color:transparent;color:#fff}

/* ---------- fatal ---------- */
.fatal{max-width:640px;margin:60px auto;padding:24px}

/* ---------- responsive ---------- */
@media (max-width: 900px){
  .body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .side{min-width:0}
  .app{grid-template-columns:minmax(0,1fr)}
  .topbar{padding:0 12px;gap:8px}
  .brand{font-size:14px}
  .brand small{display:none}
  .top-meta{min-width:0;overflow:hidden}
  .top-meta .pill{max-width:128px;overflow:hidden;text-overflow:ellipsis;display:inline-block}
  .cut-head .row{flex-wrap:wrap!important;margin-left:0!important}
  .beat{grid-template-columns:1fr}
  .side{border-right:0;border-bottom:1px solid var(--line)}
  .side-scroll{display:flex;gap:4px;overflow-x:auto;padding:8px}
  .side-label,.side-foot{display:none}
  .nav-btn{width:auto;white-space:nowrap}
  .page{padding:18px 16px 60px}
  .g2,.g3,.g4,.mode-cards,.export-grid,.cut-body,.frame-body{grid-template-columns:1fr}
  .span2{grid-column:auto}
  .top-title{display:none}
}

/* ---------- print (제작 지시서) ---------- */
#print-root{display:none}
@media print{
  @page{size:A4;margin:16mm 14mm 16mm 16mm}
  body{background:#fff}
  .app,.modal-back,.toasts{display:none!important}
  #print-root{display:block;font-family:var(--font);color:#000;font-size:10.5pt;line-height:1.5}
  .doc h1{font-size:18pt;text-align:center;margin:0 0 4mm;letter-spacing:1px}
  .doc .doc-sub{text-align:center;color:#333;margin-bottom:6mm;font-size:10pt}
  .doc h2{font-size:12.5pt;margin:7mm 0 2.5mm;padding-bottom:1mm;border-bottom:1.5px solid #1F3864;color:#1F3864;break-after:avoid}
  .doc h3{font-size:11pt;margin:4mm 0 2mm;break-after:avoid}
  .doc table{width:100%;border-collapse:collapse;margin:1mm 0 3mm;font-size:9.5pt}
  .doc th,.doc td{border:1px solid #888;padding:1.6mm 2mm;vertical-align:top;text-align:left}
  .doc th{background:#F2F2F2;font-weight:700;white-space:nowrap}
  .doc tr{break-inside:avoid}
  .doc .kv th{width:30mm}
  .doc ul{margin:1mm 0;padding-left:6mm}
  .doc .mono{font-family:var(--mono);font-size:8.5pt;word-break:break-word}
  .doc .page-break{break-before:page}
  .doc .foot{margin-top:8mm;font-size:9pt;color:#444;border-top:1px solid #aaa;padding-top:2mm}
  .doc .lv-err{color:#B42318;font-weight:700} .doc .lv-warn{color:#9A6200;font-weight:700} .doc .lv-info{color:#2E5FA3;font-weight:700}
}

</style>
</head>
<body>
<div id="app"><div style="padding:40px;font-family:sans-serif">불러오는 중입니다… 화면이 계속 비어 있으면 최신 Chrome 또는 Edge 브라우저로 여십시오.</div></div>
<div id="modal-host"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="print-root"></div>
<script>
'use strict';
/* =====================================================================
 * core.js — 공통 유틸, 상수, 데이터 모델, 저장소, 정규화, V6 변환
 * ===================================================================== */

const APP_VERSION = '7.2';
const SCHEMA = 'shortform-studio/1';

/* ---------- 유틸 ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = (o) => JSON.parse(JSON.stringify(o));
const str = (v) => (v == null ? '' : typeof v === 'string' ? v : typeof v === 'number' || typeof v === 'boolean' ? String(v) : Array.isArray(v) ? v.map(str).join(', ') : typeof v === 'object' ? JSON.stringify(v) : String(v));
const num = (v, d = 0) => { const n = typeof v === 'number' ? v : parseFloat(String(v == null ? '' : v).replace(/[^0-9.\-]/g, '')); return Number.isFinite(n) ? n : d; };
const round1 = (n) => Math.round(n * 10) / 10;
const pad2 = (n) => String(n).padStart(2, '0');
const sum = (arr) => arr.reduce((a, b) => a + b, 0);

function hashStr(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
function stamp(d = new Date()) { return `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}_${pad2(d.getHours())}${pad2(d.getMinutes())}`; }
function fmtDate(ms) { if (!ms) return '-'; const d = new Date(ms); return `${d.getFullYear()}.${pad2(d.getMonth() + 1)}.${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }

/* 비교용 정규화: 공백·문장부호 제거, 소문자 */
const normCmp = (s) => str(s).toLowerCase().replace(/[\s"'“”‘’`.,·:;!?()\[\]{}<>~\-_/\\|]+/g, '');
/* 한국어 음절 수(내레이션 속도 추정용) */
function syllables(t) {
  t = str(t);
  const ko = (t.match(/[가-힣]/g) || []).length;

/* ---------- IndexedDB 저장소 (실패 시 메모리 대체) ---------- */
const DB = {
  name: 'shortform-studio', store: 'projects', db: null, memory: null,
  async open() {
    if (this.db || this.memory) return;
    try {
      if (!window.indexedDB) throw new Error('no idb');
      this.db = await new Promise((resolve, reject) => {
        const req = indexedDB.open(this.name, 1);
        req.onupgradeneeded = () => { const db = req.result; if (!db.objectStoreNames.contains(this.store)) db.createObjectStore(this.store, { keyPath: 'id' }); };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
        req.onblocked = () => reject(new Error('blocked'));
      });
    } catch (e) {
      this.memory = new Map();
    }
  },
  get persistent() { return !!this.db; },
  async tx(mode, fn) {
    await this.open();
    if (this.memory) return fn(null);
    return new Promise((resolve, reject) => {
      const t = this.db.transaction(this.store, mode);
      const st = t.objectStore(this.store);
      let result;
      Promise.resolve(fn(st)).then((r) => { result = r; });
      t.oncomplete = () => resolve(result);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error || new Error('저장이 중단되었습니다(저장 공간 부족 가능).'));
    });
  },
  async all() {
    await this.open();
    if (this.memory) return Array.from(this.memory.values()).map(clone);
    return new Promise((resolve, reject) => {
      const req = this.db.transaction(this.store, 'readonly').objectStore(this.store).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  },
  async put(p) {
    const data = clone(p);
    await this.open();
    if (this.memory) { this.memory.set(data.id, data); return; }
    await this.tx('readwrite', (st) => { st.put(data); });
  },
  async remove(id) {
    await this.open();
    if (this.memory) { this.memory.delete(id); return; }
    await this.tx('readwrite', (st) => { st.delete(id); });
  },
  async clearAll() {
    await this.open();
    if (this.memory) { this.memory.clear(); return; }
    await this.tx('readwrite', (st) => { st.clear(); });
  },
};

/* ---------- 파일 다운로드 ---------- */
function downloadFile(filename, content, mime = 'text/plain;charset=utf-8') {
  const blob = content instanceof Blob ? content : new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.style.display = 'none';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
}
/* 파일 이름은 프로젝트 생성 시각 기준으로 고정 — 내보낸 시점이 달라도 프레임 파일명이 서로 일치 */
function fileBase(p) { return `shortform_${stamp(new Date(p.createdAt || Date.now()))}_${p.mode}`; }

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext !== false) { await navigator.clipboard.writeText(text); return true; }
  } catch (e) { /* fallback */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}

/* ---------- 컷 수 권장 범위 ---------- */
function cutRange(p) {
  const T = p.settings.duration;
  const L = allowedLengths(p);
  if (!L.length) return [Math.max(2, Math.ceil(T / 5)), Math.max(3, Math.ceil(T / 3))];
  const max = Math.max(...L);
  const minCuts = Math.ceil(T / max);
  const avg = (sum(L) / L.length) * 0.85;
  const rec = Math.max(minCuts, Math.round(T / avg));
  return [Math.max(minCuts, rec - 1), rec + 2];
}

function planForPrompt(plan) {

  if (plan.characters.length) o.characters = plan.characters.map((c) => ({ name: c.name, fixedPrompt: c.fixedPrompt, voice: c.voice }));

}

/* ---------- 응답 텍스트에서 JSON 추출 ---------- */
function extractJSON(text) {
  let t = str(text).replace(/^﻿/, '').trim();
  if (!t) throw new Error('붙여 넣은 내용이 비어 있습니다.');
  const fence = t.match(/```(?:json|JSON)?\s*([\s\S]*?)```/);
  if (fence && /[{[]/.test(fence[1])) t = fence[1].trim();
  const start = t.search(/[{[]/);
  if (start < 0) throw new Error('응답에서 JSON을 찾지 못했습니다. AI 답변 전체를 그대로 붙여 넣었는지 확인하십시오.');
  // 괄호 균형 탐색(문자열 내부 무시)
  const open = t[start];
  let depth = 0, inStr = false, escp = false, end = -1;
  for (let i = start; i < t.length; i++) {
    const ch = t[i];
    if (inStr) {
      if (escp) escp = false; else if (ch === '\\') escp = true; else if (ch === '"') inStr = false;
      continue;
    }
    if (ch === '"') inStr = true;
    else if (ch === '{' || ch === '[') depth++;
    else if (ch === '}' || ch === ']') { depth--; if (depth === 0) { end = i; break; } }
  }
  if (end < 0) throw new Error(`JSON이 중간에 끊겨 있습니다(${open === '{' ? '}' : ']'} 누락). AI 답변이 잘렸다면 "이어서 작성"을 요청한 뒤 전체를 붙여 넣으십시오.`);
  let body = t.slice(start, end + 1);
  try { return JSON.parse(body); } catch (e1) {
    // 흔한 오류 자동 복구: 둥근 따옴표, 끝 쉼표
    const repaired = body.replace(/[“”]/g, '"').replace(/,\s*([}\]])/g, '$1');
    try { return JSON.parse(repaired); } catch (e2) {
      throw new Error(`JSON 문법 오류로 읽을 수 없습니다: ${e1.message}`);
    }
  }
}

/* ---------- Gemini API ---------- */
class AIError extends Error { constructor(msg, code) { super(msg); this.code = code; } }
const GEMINI_BASE = 'https://generativelanguage.googleapis.com/v1beta';

function geminiErrorMessage(status, bodyText) {
  let detail = '';
  try { detail = JSON.parse(bodyText).error.message || ''; } catch (e) { detail = str(bodyText).slice(0, 200); }
  const map = {
    400: '요청이 거부되었습니다. 모델 ID가 텍스트 생성을 지원하는지 확인하십시오.',
    401: 'API 키가 올바르지 않습니다. 설정 화면에서 키를 다시 입력하십시오.',
    403: 'API 키 권한이 없거나 사용이 제한되었습니다. 키의 API 제한 설정을 확인하십시오.',
    404: '모델을 찾을 수 없습니다. 설정 화면에서 "모델 목록 불러오기"로 현재 사용 가능한 모델을 선택하십시오.',
    429: '사용 한도를 초과했습니다. 잠시 후 다시 시도하거나 붙여넣기 방식으로 진행하십시오.',
    500: 'Gemini 서버 오류입니다. 잠시 후 다시 시도하십시오.',
    503: 'Gemini 서버가 혼잡합니다. 잠시 후 다시 시도하십시오.',
  };
  const base = map[status] || `API 오류(${status})가 발생했습니다.`;
  if (status === 400 && /API key/i.test(detail)) return map[401];
  return detail ? `${base}\n(상세: ${detail})` : base;
}

async function callGemini(promptText, signal, images = []) {
  const key = Prefs.getKey();
  if (!key) throw new AIError('API 키가 설정되어 있지 않습니다. 설정 화면에서 키를 입력하거나 붙여넣기 방식으로 진행하십시오.', 'nokey');
  const model = str(App.prefs.model).trim().replace(/^models\//, '');
  if (!model) throw new AIError('모델 ID가 비어 있습니다. 설정 화면에서 모델을 선택하십시오.', 'nomodel');
  const url = `${GEMINI_BASE}/models/${encodeURIComponent(model)}:generateContent`;
  const body = JSON.stringify({
    contents: [{ role: 'user', parts: [
      ...images.map((d) => { const m = d.match(/^data:(image\/[a-z]+);base64,(.+)$/); return { inline_data: { mime_type: m[1], data: m[2] } }; }),
      { text: promptText },
    ] }],
    generationConfig: { responseMimeType: 'application/json', temperature: 0.7 },
  });
  const retryable = new Set([429, 500, 502, 503, 504]);
  let lastErr = null;
  for (let attempt = 0; attempt < 3; attempt++) {
    if (signal && signal.aborted) throw new AIError('요청을 취소했습니다.', 'abort');
    const ctrl = new AbortController();
    const onAbort = () => ctrl.abort();
    if (signal) signal.addEventListener('abort', onAbort, { once: true });
    const timer = setTimeout(() => ctrl.abort(), 180000);
    try {
      const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key }, body, signal: ctrl.signal });
      const text = await res.text();
      if (!res.ok) {
        lastErr = new AIError(geminiErrorMessage(res.status, text), `http${res.status}`);
        if (retryable.has(res.status) && attempt < 2) { await new Promise((r) => setTimeout(r, 2000 * (attempt + 1))); continue; }
        throw lastErr;
      }
      let data;
      try { data = JSON.parse(text); } catch (e) { throw new AIError('API 응답을 해석할 수 없습니다.', 'badjson'); }
      if (data.promptFeedback && data.promptFeedback.blockReason) throw new AIError(`안전 정책에 의해 요청이 차단되었습니다(${data.promptFeedback.blockReason}). 입력 내용을 조정하십시오.`, 'blocked');
      const cand = (data.candidates || [])[0];
      if (!cand) throw new AIError('AI가 결과를 반환하지 않았습니다.', 'empty');
      const out = ((cand.content && cand.content.parts) || []).filter((pt) => !pt.thought && typeof pt.text === 'string').map((pt) => pt.text).join('');
      if (cand.finishReason === 'MAX_TOKENS') throw new AIError('응답이 길이 제한으로 잘렸습니다. 목표 길이를 줄이거나 붙여넣기 방식으로 진행하십시오.', 'truncated');
      if (cand.finishReason === 'SAFETY') throw new AIError('안전 정책에 의해 응답이 중단되었습니다. 입력 내용을 조정하십시오.', 'blocked');
      if (!out.trim()) throw new AIError('AI 응답이 비어 있습니다.', 'empty');
      return out;
    } catch (e) {
      if (e instanceof AIError) throw e;
      if (signal && signal.aborted) throw new AIError('요청을 취소했습니다.', 'abort');
      lastErr = new AIError(e.name === 'AbortError' ? '응답 시간이 초과되었습니다.' : '네트워크에 연결할 수 없습니다. 행정망 등 외부 접속이 제한된 PC라면 붙여넣기 방식을 사용하십시오.', 'network');
      if (attempt < 2) { await new Promise((r) => setTimeout(r, 2000 * (attempt + 1))); continue; }
      throw lastErr;
    } finally {
      clearTimeout(timer);
      if (signal) signal.removeEventListener('abort', onAbort);
    }
  }
  throw lastErr || new AIError('알 수 없는 오류', 'unknown');
}

async function listGeminiModels(key) {
  const res = await fetch(`${GEMINI_BASE}/models?pageSize=200`, { headers: { 'x-goog-api-key': key } });
  const text = await res.text();
  if (!res.ok) throw new AIError(geminiErrorMessage(res.status, text), `http${res.status}`);
  const data = JSON.parse(text);
  return (data.models || [])
    .filter((m) => (m.supportedGenerationMethods || []).includes('generateContent') && /gemini/i.test(m.name) && !/embedding|image|tts|audio|live/i.test(m.name))
    .map((m) => ({ id: m.name.replace(/^models\//, ''), label: m.displayName || m.name }))
    .sort((a, b) => b.id.localeCompare(a.id));
}

function distributeUse(p) {
  const T = p.settings.duration;
  const cuts = p.cuts;
  const L = allowedLengths(p);
  if (!cuts.length) return { ok: false, msg: '컷이 없습니다.' };
  const MIN = 0.5;
  let raised = 0;
  if (L.length) {
    const maxL = Math.max(...L);
    // 허용 외 렌더 길이는 먼저 허용값으로 정리
    cuts.forEach((c) => { if (!L.includes(num(c.renderSec))) c.renderSec = L.find((x) => x >= num(c.useSec)) || maxL; });
    if (cuts.length * maxL < T - 1e-9) {
      return { ok: false, msg: `컷 ${cuts.length}개를 모두 최대 ${maxL}초로 만들어도 목표 ${T}초에 못 미칩니다. 컷을 ${Math.ceil(T / maxL) - cuts.length}개 이상 추가하십시오.` };
    }
    // 렌더 합계가 부족하면 내레이션이 긴 컷부터 렌더 길이를 한 단계씩 늘림
    const weight = (c) => syllables(c.narration) || charCount(c.subtitle);
    let guard = 200;
    while (sum(cuts.map((c) => num(c.renderSec))) < T - 1e-9 && guard-- > 0) {
      const cand = cuts.filter((c) => num(c.renderSec) < maxL).sort((a, b) => weight(b) - weight(a))[0];
      if (!cand) break;
      cand.renderSec = L.find((x) => x > num(cand.renderSec)) || maxL;
      raised++;
    }
  }
  const caps = cuts.map((c) => (L.length ? num(c.renderSec) : Infinity));
  if (sum(caps) < T - 1e-9) {
    return { ok: false, msg: `렌더 길이 합계(${round1(sum(caps))}초)가 목표(${T}초)보다 짧아 배분할 수 없습니다. 컷을 추가하십시오.` };
  }
  if (cuts.length * MIN > T) return { ok: false, msg: '컷 수가 너무 많아 배분할 수 없습니다.' };
  // 가중치: 내레이션 음절 수(없으면 자막 글자 수, 그것도 없으면 1)
  const w = cuts.map((c) => Math.max(1, syllables(c.narration) || charCount(c.subtitle) || 1));
  const val = new Array(cuts.length).fill(null);
  let remaining = T;
  for (let guard = 0; guard < cuts.length + 2; guard++) {
    const free = val.map((v, i) => (v === null ? i : -1)).filter((i) => i >= 0);
    if (!free.length) break;
    const W = sum(free.map((i) => w[i]));
    let clamped = false;
    for (const i of free) {
      const v = (remaining * w[i]) / W;
      if (v > caps[i]) { val[i] = caps[i]; clamped = true; }
      else if (v < MIN) { val[i] = MIN; clamped = true; }
    }
    if (!clamped) { free.forEach((i) => { val[i] = (remaining * w[i]) / W; }); break; }
    remaining = T - sum(val.filter((v) => v !== null));
  }
  // 0.1초 단위 반올림 후 오차 보정
  let out = val.map((v) => Math.max(MIN, round1(v)));
  let diff = round1(T - sum(out));
  let safety = 2000;
  while (Math.abs(diff) >= 0.05 && safety-- > 0) {
    const step = diff > 0 ? 0.1 : -0.1;
    const order = out.map((v, i) => i).sort((a, b) => (step > 0 ? (caps[b] - out[b]) - (caps[a] - out[a]) : out[b] - out[a]));
    const idx = order.find((i) => (step > 0 ? out[i] + 0.1 <= caps[i] + 1e-9 : out[i] - 0.1 >= MIN - 1e-9));
    if (idx === undefined) break;
    out[idx] = round1(out[idx] + step);
    diff = round1(T - sum(out));
  }
  cuts.forEach((c, i) => {
    c.useSec = out[i];
    if (!L.length) c.renderSec = out[i];
  });
  return { ok: true, msg: `사용 길이를 합계 ${round1(sum(out))}초로 배분했습니다.${raised ? ` 렌더 길이가 부족한 컷 ${raised}곳은 한 단계 늘렸습니다.` : ''}` };
}

/* 렌더 길이를 허용값 중 사용 길이 이상인 가장 짧은 값으로 맞춤 */
function snapRender(p) {
  const L = allowedLengths(p);
  let n = 0;
  p.cuts.forEach((c) => {
    if (!L.length) { if (c.renderSec !== c.useSec) { c.renderSec = c.useSec; n++; } return; }
    const target = L.find((x) => x >= c.useSec) || Math.max(...L);
    if (c.renderSec !== target) { c.renderSec = target; n++; }
    if (c.useSec > target) c.useSec = target;
  });
  return n;
}

/* ---------- 점검 ---------- */
/* item: { level:'err'|'warn'|'info', group, text, cut?:index, fix?:{id,label} } */
function runChecks(p, prefs) {
  const items = [];
  const add = (level, group, text, extra = {}) => items.push({ level, group, text, ...extra });
  const s = p.settings;
  const cuts = p.cuts;
  const L = allowedLengths(p);
  const T = s.duration;
  const tol = num(prefs.tolerance, 1);
  const exemptTexts = [p.mode === 'promo' ? p.input.promo.disclaimer : '', s.aiLabel ? s.aiLabelText : ''].filter(Boolean);

  /* --- 진행 상태 --- */
  if (!p.plan) add('warn', '진행 상태', '구성안이 아직 작성되지 않았습니다.', { step: 'plan' });
  if (isPlanStale(p)) add('warn', '진행 상태', '구성안 작성 이후 입력 자료가 변경되었습니다. 구성안을 다시 확인하십시오.', { step: 'plan', fix: { id: 'ackPlan', label: '현재 구성안으로 확정' } });
  if (!cuts.length) { add('err', '진행 상태', '컷 시트가 비어 있습니다.', { step: 'cuts' }); }
  if (isCutsStale(p)) add('warn', '진행 상태', '컷 시트 작성 이후 구성안 또는 제작 조건이 변경되었습니다.', { step: 'cuts', fix: { id: 'ackCuts', label: '현재 컷 시트로 확정' } });

  /* --- 길이 --- */
  if (cuts.length) {
    const totalUse = round1(sum(cuts.map((c) => num(c.useSec))));
    const totalRender = round1(sum(cuts.map((c) => num(c.renderSec))));
    cuts.forEach((c, i) => {
      if (L.length && !L.includes(num(c.renderSec))) add('err', '길이', `렌더 길이 ${c.renderSec}초는 ${s.engine.name}에서 생성할 수 없습니다(허용: ${L.join('·')}초).`, { cut: i, fix: { id: 'snapRender', label: '렌더 길이 자동 맞춤' } });
      if (!(num(c.useSec) > 0)) add('err', '길이', '사용 길이가 0초 이하입니다.', { cut: i, fix: { id: 'autoUse', label: '사용 길이 자동 배분' } });
      else if (L.length && num(c.useSec) > num(c.renderSec) + 1e-9) add('err', '길이', `사용 길이(${c.useSec}초)가 렌더 길이(${c.renderSec}초)보다 깁니다.`, { cut: i, fix: { id: 'snapRender', label: '렌더 길이 자동 맞춤' } });
    });
    if (L.length && totalRender < T) add('err', '길이', `렌더 길이 합계 ${totalRender}초가 목표 ${T}초보다 짧습니다. 컷을 추가하거나 렌더 길이를 늘리십시오.`);
    const diff = round1(totalUse - T);
    if (Math.abs(diff) > tol) add(Math.abs(diff) > Math.max(3, tol * 3) ? 'err' : 'warn', '길이', `사용 길이 합계 ${totalUse}초 — 목표 ${T}초와 ${diff > 0 ? '+' : ''}${diff}초 차이(허용 ±${tol}초).`, { fix: { id: 'autoUse', label: '사용 길이 자동 배분' } });
  }

  /* --- 컷 내용 --- */
  const styleN = normCmp(s.styleText);
  let styleMissing = 0;
  cuts.forEach((c, i) => {
    if (!c.imagePrompt.trim()) add('err', '프롬프트', '이미지 프롬프트가 비어 있습니다.', { cut: i });
    if (/[가-힣]/.test(c.imagePrompt + c.motionPrompt)) add('info', '프롬프트', '이미지·모션 프롬프트에 한글이 있습니다. 영상·이미지 엔진은 영어 지시의 정확도가 더 높습니다.', { cut: i });
    const words = (c.motionPrompt.match(/[A-Za-z']+/g) || []).length;
    if (words > 60) add('warn', '프롬프트', `모션 프롬프트가 ${words}단어로 깁니다. 동작 1개·카메라 1개, 50단어 이내를 권장합니다.`, { cut: i });
    const positivePrompt = c.imagePrompt.replace(/\b(no|without|free of|avoid)\s+(?:[a-z-]+\s+){0,2}(text|letters?|words?|captions?|logos?|signage|typography|subtitles?)\b/gi, '');
    if (/\b(text|caption|subtitle|letters?|typography|signage|logo|words?)\b/i.test(positivePrompt)) add('info', '프롬프트', '이미지 프롬프트에 글자·로고 관련 단어가 있습니다. 화면 속 글자가 깨져 생성될 수 있습니다.', { cut: i });
    if (styleN && c.imagePrompt.trim() && !normCmp(c.imagePrompt).includes(styleN)) styleMissing++;
    const rt = ratioTokens(c.imagePrompt);
    if (rt.length) {
      const conflict = rt.some((t) => { const m = t.match(/(\d{1,2})\s*:\s*(\d{1,2})/); if (m) return `${+m[1]}:${+m[2]}` !== s.ratio; const o = (RATIO_INFO[s.ratio] || {}).orient; return (/vertical|portrait/i.test(t) && o !== 'vertical') || (/horizontal|landscape|widescreen/i.test(t) && o !== 'horizontal') || (/square/i.test(t) && o !== 'square'); });
      if (conflict || (s.imageTool || 'generic') !== 'none') add(conflict ? 'err' : 'info', '프롬프트', conflict ? `이미지 프롬프트 본문에 프로젝트 화면 비율(${s.ratio})과 다른 표기가 있습니다: ${rt.join(', ')}` : `이미지 프롬프트 본문에 비율 표기(${rt.join(', ')})가 있습니다. 복사할 때 ${s.ratio} 표기가 자동으로 붙으므로 본문에서는 빼는 것이 좋습니다.`, { cut: i, fix: { id: 'stripRatio', label: '본문의 비율 표기 제거' } });
    }
    if (!c.narration.trim() && !c.subtitle.trim()) add('info', '자막·내레이션', '내레이션과 자막이 모두 비어 있습니다.', { cut: i });
    const use = num(c.useSec);
    if (use > 0) {
      let sub = c.subtitle;
      exemptTexts.forEach((t) => { sub = sub.split(t).join(''); });
      const cps = charCount(sub) / use;
      if (cps > prefs.cps) add('warn', '자막·내레이션', `자막이 초당 ${round1(cps)}자로 기준(${prefs.cps}자)을 넘습니다. 시청자가 읽기 어렵습니다.`, { cut: i });
      const lineMax = (RATIO_INFO[s.ratio] || RATIO_INFO['9:16']).lineChars;
      const longLine = sub.split('\n').map((ln) => ln.trim()).filter((ln) => ln.length > lineMax);
      if (longLine.length) add('info', '자막·내레이션', `자막 한 줄이 ${lineMax}자(${s.ratio} 화면 기준)를 넘습니다. 편집기에서 두 줄로 나뉩니다: "${longLine[0].slice(0, 20)}…"`, { cut: i });
      const sps = syllables(c.narration.replace(/^[^:：]{1,12}[:：]\s*/, '')) / use;
      if (sps > prefs.sps) add('warn', '자막·내레이션', `내레이션이 초당 ${round1(sps)}음절로 기준(${prefs.sps}음절)을 넘습니다. 사용 길이 안에 읽기 어렵습니다.`, { cut: i });
    }
  });
  /* --- 이미지·모션 단계 --- */
  if (cuts.length && p.cuts.some((c) => c.scene || c.imagePrompt)) {
    const noImg = cuts.filter((c) => !c.startImage).length;
    if (noImg) add(noImg === cuts.length ? 'info' : 'warn', '이미지·모션', `시작 프레임 이미지가 없는 컷이 ${noImg}개 있습니다. 이미지를 만든 뒤 올려야 이미지 기반 모션 프롬프트를 작성할 수 있습니다.`, { step: 'frames' });
    const [rw, rh] = s.ratio.split(':').map(Number);
    cuts.forEach((c, i) => {
      const st = cutStage(c);
      if (st === 'needMotion') add('warn', '이미지·모션', c.review ? '이미지가 바뀌었습니다. 새 이미지를 보고 모션 프롬프트를 다시 작성하십시오.' : '이미지를 올렸지만 이미지 기반 모션 프롬프트를 아직 작성하지 않았습니다.', { cut: i, step: 'frames' });
      if (st === 'review') add('warn', '이미지·모션', `이미지가 기획과 ${MATCH_LV[c.review.match]}합니다. "현재 이미지로 진행" 또는 "이미지 다시 만들기"를 선택하십시오.`, { cut: i, step: 'frames' });
      if (st === 'regen') add('warn', '이미지·모션', '수정된 이미지 프롬프트로 이미지를 다시 만들어 올려야 합니다.', { cut: i, step: 'frames' });
      if (st === 'done' && c.review && c.review.decision === 'proceed' && c.review.match !== 'match') add('info', '이미지·모션', `기획과 ${MATCH_LV[c.review.match]}하는 이미지로 진행하기로 했습니다.`, { cut: i, step: 'frames' });
      if (st === 'done' && L.length && !c.motionPrompt.trim()) add('warn', '이미지·모션', '모션 프롬프트가 비어 있습니다.', { cut: i, step: 'frames' });
      [['시작', c.startMeta], ['끝', c.endMeta]].forEach(([nm, m]) => {
        if (!m || !m.w || !m.h || !rw || !rh) return;
        const ar = m.w / m.h, target = rw / rh;
        if (Math.abs(ar - target) / target > 0.08) add('warn', '이미지·모션', `${nm} 프레임 비율(${m.w}×${m.h})이 프로젝트 화면 비율 ${s.ratio}과 다릅니다. 영상 생성 시 잘리거나 여백이 생깁니다.`, { cut: i, step: 'frames' });
      });
      if (c.endImage && L.length && s.engine.refLock8 && num(c.renderSec) !== 8) add('info', '이미지·모션', '끝 프레임을 함께 지정하는 영상 생성은 도구에 따라 8초만 지원합니다. 사용하는 도구의 안내를 확인하십시오.', { cut: i, step: 'frames' });
      const next = cuts[i + 1];
      if (c.endImage && next && next.startImage && c.endId !== next.startId) add('info', '이미지·모션', `끝 프레임이 CUT ${pad2(i + 2)}의 시작 프레임과 다릅니다. 장면 전환을 의도한 것이 아니라면 연결을 확인하십시오.`, { cut: i, step: 'frames' });
    });
  }

  if (styleMissing) add('warn', '일관성', `${styleMissing}개 컷의 이미지 프롬프트에 화풍 문구가 없습니다. 컷마다 화풍이 달라질 수 있습니다.`, { fix: { id: 'insertStyle', label: '화풍 문구 일괄 삽입' } });

  /* --- AI 활용 표시 --- */
  if (cuts.length && s.aiLabel && s.aiLabelText) {
    const has = cuts.some((c) => normCmp(c.subtitle).includes(normCmp(s.aiLabelText)));
    if (!has) add('warn', '고지', 'AI 활용 표시 문구가 자막에 없습니다.', { fix: { id: 'addAiLabel', label: '마지막 컷 자막에 추가' } });
  }

  /* --- 모드별 --- */
  const spoken = (c) => stripEnumerators(`${c.narration}\n${c.subtitle}`);
  if (p.mode === 'promo') {
    const b = p.input.promo;
    if (!b.name.trim()) add('warn', '사실 확인', '브리프의 행사·정책명이 비어 있습니다.', { step: 'input' });
    if (!b.date.trim()) add('warn', '사실 확인', '브리프의 일시·기간이 비어 있습니다.', { step: 'input' });
    const factInts = new Set(extractInts(Object.values(b).join(' ') + ' ' + s.aiLabelText));
    cuts.forEach((c, i) => {
      const unknown = Array.from(new Set(extractInts(spoken(c)))).filter((n) => !factInts.has(n));
      if (unknown.length) add('warn', '사실 확인', `브리프에 없는 숫자: ${unknown.join(', ')} — 사실 여부를 확인하십시오.`, { cut: i });
    });
    if (b.disclaimer.trim() && cuts.length) {
      const all = normCmp(cuts.map(spoken).join(' '));
      if (!all.includes(normCmp(b.disclaimer))) add('err', '고지', `필수 고지 "${b.disclaimer}"가 원문 그대로 들어간 컷이 없습니다.`, { fix: { id: 'addDisclaimer', label: '마지막 컷 자막에 추가' } });
    }
  }
  if (p.mode === 'lecture') {
    const src = p.input.lecture.source;
    if (!src.trim()) add('err', '원문 대조', '강의 원고가 비어 있습니다.', { step: 'input' });
    else {
      const srcInts = new Set(extractInts(src + ' ' + s.aiLabelText));
      cuts.forEach((c, i) => {
        const unknown = Array.from(new Set(extractInts(spoken(c)))).filter((n) => !srcInts.has(n));
        if (unknown.length) add('warn', '원문 대조', `원고에 없는 숫자: ${unknown.join(', ')} — 원고와 대조하십시오.`, { cut: i });
      });
      const srcN = normCmp(src);
      (p.plan ? p.plan.keyPoints : []).forEach((k, i) => {
        const q = normCmp(k.sourceQuote);
        if (!q) { add('warn', '원문 대조', `핵심 메시지 ${i + 1}("${k.point}")에 근거 문장이 없습니다.`, { step: 'plan' }); return; }
        if (srcN.includes(q)) return;
        const ratio = shingleOverlap(q, srcN);
        if (ratio >= 0.6) add('info', '원문 대조', `핵심 메시지 ${i + 1}의 근거 문장이 원고와 일부 다르게 옮겨졌습니다(일치율 ${Math.round(ratio * 100)}%).`, { step: 'plan' });
        else add('warn', '원문 대조', `핵심 메시지 ${i + 1}의 근거 문장을 원고에서 찾을 수 없습니다(일치율 ${Math.round(ratio * 100)}%). AI가 지어낸 문장일 수 있습니다.`, { step: 'plan' });
      });
      if (src.length > 30000) add('info', '원문 대조', `원고가 ${src.length.toLocaleString()}자로 깁니다. AI가 뒷부분을 놓칠 수 있으니 핵심 부분만 넣는 것을 권장합니다.`, { step: 'input' });
    }
  }
  const chars = p.plan ? p.plan.characters : [];
  if (p.mode === 'anim') {
    if (!chars.length) add('err', '캐릭터', '구성안에 캐릭터가 없습니다.', { step: 'plan' });
    chars.forEach((ch) => { if (!ch.fixedPrompt.trim()) add('err', '캐릭터', `캐릭터 "${ch.name}"의 고정 묘사(fixedPrompt)가 비어 있습니다.`, { step: 'plan' }); });
  }
  if (chars.length) {
    const byName = new Map(chars.map((ch) => [normCmp(ch.name), ch]));
    let missing = 0;
    cuts.forEach((c, i) => {
      c.characters.forEach((nm) => {
        const ch = byName.get(normCmp(nm));
        if (!ch) { add('warn', '캐릭터', `구성안에 없는 캐릭터 "${nm}"가 등장합니다.`, { cut: i }); return; }
        if (ch.fixedPrompt.trim() && !normCmp(c.imagePrompt).includes(normCmp(ch.fixedPrompt))) {
          missing++;
          add('warn', '캐릭터', `"${ch.name}"의 고정 묘사가 이미지 프롬프트에 그대로 들어 있지 않습니다. 외형이 달라질 수 있습니다.`, { cut: i });
        }
      });
    });
    if (missing) add('info', '캐릭터', `고정 묘사 누락 ${missing}건을 한 번에 보완할 수 있습니다.`, { fix: { id: 'insertChar', label: '고정 묘사 일괄 삽입' } });
  }

  const order = { err: 0, warn: 1, info: 2 };
  items.sort((a, b) => order[a.level] - order[b.level]);
  return items;
}

/* ---------- 컷별 이미지·모션 진행 단계 ----------
 * noImage: 시작 프레임 없음 / needMotion: 이미지 있으나 모션 미작성(또는 이미지 변경)
 * review: 기획과 다른 이미지 — 담당자 선택 대기 / regen: 이미지 재생성 대기 / done: 확정 */
function cutStage(c) {
  const r = c.review;
  if (!c.startImage) return r && r.decision === 'regen' ? 'regen' : 'noImage';
  if (!r || r.frameKey !== frameKey(c)) return 'needMotion';
  if (r.decision === 'pending') return 'review';
  if (r.decision === 'regen') return 'regen';
  return 'done';
}
const STAGE_LABEL = { noImage: ['', '이미지 대기'], needMotion: ['warn', '모션 작성 필요'], review: ['warn', '선택 필요'], regen: ['warn', '이미지 재생성'], done: ['ok', '모션 확정'] };

/* "핵심 1", "STEP 2", "1." 같은 순번 표기는 사실 숫자로 보지 않음 */
function stripEnumerators(t) {
  return str(t).replace(/(핵심|단계|포인트|point|step|part|tip|제)\s*\d{1,2}(?!\s*(?:[%％]|원|명|건|회|개|일|월|년|시|분|초|곳|세|km|m\b))/gi, '$1').replace(/(^|\n)\s*\d{1,2}[.)](?!\d)/g, '$1');
}

function shingleOverlap(q, srcN, k = 5) {
  if (q.length < k) return srcN.includes(q) ? 1 : 0;
  let hit = 0, total = 0;
  for (let i = 0; i <= q.length - k; i++) { total++; if (srcN.includes(q.slice(i, i + k))) hit++; }
  return total ? hit / total : 0;
}

/* ---------- 빠른 수정 ---------- */
function applyFix(p, id) {
  const s = p.settings;
  switch (id) {
    case 'autoUse': return distributeUse(p);
    case 'snapRender': { const n = snapRender(p); return { ok: true, msg: `${n}개 컷의 렌더 길이를 맞췄습니다.` }; }
    case 'insertStyle': {
      let n = 0;
      p.cuts.forEach((c) => { if (s.styleText && !normCmp(c.imagePrompt).includes(normCmp(s.styleText))) { c.imagePrompt = c.imagePrompt.trim() ? `${c.imagePrompt.trim().replace(/[,.]$/, '')}, ${s.styleText}` : s.styleText; n++; } });
      return { ok: true, msg: `${n}개 컷에 화풍 문구를 넣었습니다.` };
    }
    case 'insertChar': {
      const byName = new Map((p.plan ? p.plan.characters : []).map((ch) => [normCmp(ch.name), ch]));
      let n = 0;
      p.cuts.forEach((c) => {
        c.characters.forEach((nm) => {
          const ch = byName.get(normCmp(nm));
          if (ch && ch.fixedPrompt.trim() && !normCmp(c.imagePrompt).includes(normCmp(ch.fixedPrompt))) { c.imagePrompt = `${ch.fixedPrompt.trim()}, ${c.imagePrompt.trim()}`.replace(/,\s*$/, ''); n++; }
        });
      });
      return { ok: true, msg: `${n}건의 고정 묘사를 넣었습니다.` };
    }
    case 'addAiLabel': {
      const last = p.cuts[p.cuts.length - 1];
      if (!last) return { ok: false, msg: '컷이 없습니다.' };
      last.subtitle = last.subtitle.trim() ? `${last.subtitle.trim()}\n${s.aiLabelText}` : s.aiLabelText;
      return { ok: true, msg: '마지막 컷 자막에 AI 활용 표시를 넣었습니다.' };
    }
    case 'addDisclaimer': {
      const last = p.cuts[p.cuts.length - 1];
      if (!last) return { ok: false, msg: '컷이 없습니다.' };
      const d = p.input.promo.disclaimer.trim();
      last.subtitle = last.subtitle.trim() ? `${last.subtitle.trim()}\n${d}` : d;
      return { ok: true, msg: '마지막 컷 자막에 필수 고지를 넣었습니다.' };
    }
    case 'stripRatio': {
      let n = 0;
      p.cuts.forEach((c) => { if (ratioTokens(c.imagePrompt).length) { c.imagePrompt = stripRatioTokens(c.imagePrompt); n++; } });
      return { ok: true, msg: `${n}개 컷의 본문에서 비율 표기를 뺐습니다. 복사할 때 ${s.ratio} 표기가 자동으로 붙습니다.` };
    }
    case 'ackPlan': p.basis.plan = planBasis(p); return { ok: true, msg: '현재 구성안을 기준으로 확정했습니다.' };
    case 'ackCuts': p.basis.cuts = cutsBasis(p); return { ok: true, msg: '현재 컷 시트를 기준으로 확정했습니다.' };
    default: return { ok: false, msg: '알 수 없는 수정 항목입니다.' };
  }
}

'use strict';
/* =====================================================================
 * export.js — SRT·CSV·TXT·JSON 내보내기, 제작 지시서(인쇄/PDF)
 * ===================================================================== */

function srtTime(sec) {
  const ms = Math.round(sec * 1000);
  const h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000), s = Math.floor((ms % 60000) / 1000), r = ms % 1000;
  return `${pad2(h)}:${pad2(m)}:${pad2(s)},${String(r).padStart(3, '0')}`;
}
/* 긴 자막은 가운데 가까운 띄어쓰기에서 두 줄로 나눔 */
function wrapSubtitle(text, maxLine = 16) {
  return str(text).split('\n').map((line) => {
    line = line.trim();
    if (line.length <= maxLine) return line;
    const mid = Math.floor(line.length / 2);
    let best = -1;
    for (let d = 0; d < mid; d++) {
      if (line[mid - d] === ' ') { best = mid - d; break; }
      if (line[mid + d] === ' ') { best = mid + d; break; }
    }
    return best > 0 ? `${line.slice(0, best).trim()}\n${line.slice(best + 1).trim()}` : line;
  }).filter(Boolean).join('\n');
}

function buildSRT(p, source = 'subtitle') {
  let t = 0;
  const blocks = [];
  let n = 0;
  p.cuts.forEach((c) => {
    const dur = Math.max(0, num(c.useSec));
    const text = source === 'narration' ? c.narration : (c.subtitle || c.narration);
    const start = t; t += dur;
    if (!str(text).trim() || dur <= 0) return;
    n++;
    blocks.push(`${n}\n${srtTime(start)} --> ${srtTime(t)}\n${wrapSubtitle(text, (RATIO_INFO[p.settings.ratio] || RATIO_INFO['9:16']).lineChars)}\n`);
  });
  return blocks.join('\n');
}

function frameFileName(p, i, kind) { return `${fileBase(p)}_cut${pad2(i + 1)}_${kind}.jpg`; }
function reviewText(c) {
  const st = cutStage(c);
  if (st === 'noImage') return '이미지 대기';
  if (st === 'needMotion') return '모션 작성 필요';
  if (st === 'regen') return '이미지 재생성 대기';
  if (st === 'review') return `기획과 ${MATCH_LV[c.review.match]} — 선택 대기`;
  if (c.review.decision === 'manual') return '직접 작성 확정';
  return c.review.match === 'match' ? '기획과 일치' : `기획과 ${MATCH_LV[c.review.match]} — 현재 이미지로 진행`;
}
function csvCell(v) { let s = str(v); if (typeof v === 'string' && /^[=+\-@\t\r]/.test(s)) s = `'${s}`; return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }
function buildCSV(p) {
  const head = ['컷', '시작(초)', '끝(초)', '사용(초)', '렌더(초)', '장면', '카메라', '등장', '이미지 프롬프트', '시작 프레임', '끝 프레임', '이미지 검토', '모션 프롬프트', '내레이션', '자막', '앞 컷과의 연결'];
  let t = 0;
  const rows = p.cuts.map((c, i) => {
    const start = round1(t); t += num(c.useSec);
    return [i + 1, start, round1(t), c.useSec, c.renderSec, c.scene, c.camera, c.characters.join(', '), finalImagePrompt(p, c.imagePrompt), c.startImage ? frameFileName(p, i, 'start') : '', c.endImage ? frameFileName(p, i, 'end') : '', reviewText(c), c.motionPrompt, c.narration, c.subtitle, c.continuity];
  });
  return '﻿' + [head, ...rows].map((r) => r.map(csvCell).join(',')).join('\r\n');
}

function buildPromptsTXT(p) {
  const s = p.settings;
  const lines = [
    `# ${s.title || '제목 없음'} — 컷별 생성 프롬프트`,
    `# 유형: ${MODES[p.mode].label} / 길이: ${s.duration}초 / 비율: ${s.ratio} / 엔진: ${s.engine.name}${p.settings.useRef ? ' (참조 이미지 사용)' : ''}`,
    `# 이미지 프롬프트에는 ${s.ratio} 비율 표기가 포함되어 있습니다(${IMAGE_TOOLS[s.imageTool || 'generic'].label}). 이미지·영상 생성 도구의 비율 설정도 ${s.ratio}로 맞추십시오.`,
    '',
  ];
  if (p.plan && p.plan.characters.length) {
    lines.push('## 캐릭터 고정 묘사');
    p.plan.characters.forEach((ch) => lines.push(`- ${ch.name}: ${ch.fixedPrompt}`));
    lines.push('');
  }
  p.cuts.forEach((c, i) => {
    lines.push(`========== CUT ${pad2(i + 1)} | 렌더 ${c.renderSec}s | 사용 ${c.useSec}s ==========`);
    lines.push('[IMAGE]');
    lines.push(finalImagePrompt(p, c.imagePrompt));
    lines.push('');
    lines.push('[FRAMES]');
    lines.push(c.startImage ? `start: ${frameFileName(p, i, 'start')}${c.endImage ? ` / end: ${frameFileName(p, i, 'end')}` : ''}` : '(시작 프레임 미등록)');
    lines.push(`검토: ${reviewText(c)}`);
    lines.push('');
    lines.push('[MOTION]');
    lines.push(cutStage(c) === 'done' ? c.motionPrompt : `${c.motionPrompt ? `${c.motionPrompt}\n` : ''}※ 실제 이미지를 보고 확정하지 않은 모션 프롬프트입니다.`);
    lines.push('');
  });
  return lines.join('\n');
}

function buildNarrationTXT(p) {

}

/* ---------- 경로 접근 ---------- */
function getPath(obj, path) { return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj); }

/* ---------- 입력 준비 상태 ---------- */
function inputMissing(p) {
  const m = [];
  if (p.mode === 'promo') {
    if (!p.input.promo.name.trim()) m.push('행사·정책명');
    if (!p.input.promo.date.trim()) m.push('일시·기간');
  } else if (p.mode === 'lecture') {
    if (p.input.lecture.source.trim().length < 50) m.push('강의 원고(50자 이상)');
  } else {
    if (!(p.input.anim.idea.trim() || p.input.common.idea.trim())) m.push('이야기 아이디어');
    if (!p.input.anim.characters.some((c) => c.name.trim())) m.push('캐릭터 이름(1명 이상)');
  }
  return m;
}
function stepStatus(p, id) {
  if (id === 'setup') return p.settings.title.trim() ? 'done' : 'todo';
  if (id === 'input') return inputMissing(p).length ? 'todo' : 'done';
  if (id === 'plan') return !p.plan ? 'todo' : isPlanStale(p) ? 'stale' : 'done';
  if (id === 'cuts') return !p.cuts.length ? 'todo' : isCutsStale(p) ? 'stale' : 'done';
  if (id === 'frames') {
    if (!p.cuts.length) return 'todo';
    const st = p.cuts.map(cutStage);
    if (st.every((x) => x === 'done')) return 'done';
    return st.some((x) => x === 'review' || x === 'regen' || x === 'needMotion') ? 'stale' : 'todo';
  }
  return 'todo';
}
function stepBadge(p, id, st, errs, warns) {
  if ((id === 'plan' || id === 'cuts') && st === 'stale') return '<span class="badge warn">갱신 필요</span>';
  if (id === 'cuts' && p.cuts.length) return `<span class="badge">${p.cuts.length}컷</span>`;
  if (id === 'frames' && p.cuts.length) {
    const done = p.cuts.filter((c) => cutStage(c) === 'done').length;
    return `<span class="badge ${done === p.cuts.length ? 'ok' : st === 'stale' ? 'warn' : ''}">${done}/${p.cuts.length}</span>`;
  }
  if (id === 'checks' && p.cuts.length) return errs ? `<span class="badge err">오류 ${errs}</span>` : warns ? `<span class="badge warn">경고 ${warns}</span>` : '<span class="badge ok">양호</span>';
  return '';
}
function progressOf(p) {
  let n = 0;
  if (p.settings.title.trim()) n += 10;
  if (!inputMissing(p).length) n += 20;
  if (p.plan) n += 25;
  if (p.cuts.length) n += 15;
  if (p.cuts.length && p.cuts.every((c) => cutStage(c) === 'done')) n += 10;
  const items = runChecks(p, App.prefs);
  if (p.cuts.length && !items.some((i) => i.level === 'err')) n += 10;
  const list = manualChecklist(p.mode);
  if (list.every((m) => p.manual[m.id])) n += 10;
  return Math.min(100, n);
}

/* ---------- 저장 ---------- */
function touch() {

}
async function flushSave() {

    await DB.put(p);
    const i = App.projects.findIndex((x) => x.id === p.id);

  } catch (e) {

function updateSavePill() {

/* ---------- 토스트 ---------- */
function toast(msg, kind = '', ms = 3800, action) {

/* ---------- 폼 조각 ---------- */
function attrs(o) { return Object.entries(o).filter(([, v]) => v !== undefined && v !== false && v !== null).map(([k, v]) => (v === true ? k : `${k}="${esc(v)}"`)).join(' '); }

function autosize(el) { el.style.height = 'auto'; el.style.height = `${Math.min(el.scrollHeight + 2, 520)}px`; }

/* ---------- 렌더 골격 ---------- */
let isRendering = false, renderPending = false;
function render() {
  // 포커스된 입력칸이 교체되며 발생하는 change 이벤트가 렌더를 중첩 호출하는 것을 방지
  if (isRendering) { renderPending = true; return; }

}

  let page = '';

    page = VIEWS[inProject || App.view === 'home' || App.view === 'settings' ? App.view : 'home']();
  } catch (e) {

/* ---------- 입력 바인딩 ---------- */
function readBound(el) {
  const t = el.dataset.type;
  if (t === 'bool') return el.checked;
  if (t === 'num') return num(el.value, 0);
  if (t === 'list') return el.value.split(/[,，、]/).map((x) => x.trim()).filter(Boolean);
  return el.value;
}
let cutRefreshTimer = null;
function onBound(el, isChange) {
  const p = App.project;
  const path = el.dataset.bind;
  if (!p || !path) return;
  if (el.dataset.type === 'list' && !isChange) return; // 목록형은 입력 완료 시 반영
  let val = readBound(el);
  if (path === 'settings.duration' && isChange) { val = Math.min(600, Math.max(5, Number.isFinite(val) ? Math.round(val) : 30)); el.value = val; }
  setPath(p, path, val);
  touch();
  if (el.tagName === 'TEXTAREA') autosize(el);
  if (el.dataset.rerender && isChange) { render(); return; }
  if (path === 'settings.title') { const tt = $('.top-title'); if (tt) tt.textContent = `${MODES[p.mode].label} · ${p.settings.title || '제목 없음'}`; }
  refreshCounters();
  clearTimeout(cutRefreshTimer);
  cutRefreshTimer = setTimeout(refreshLive, 350);
}

/* 입력 중 가벼운 갱신: 글자 수 카운터, 컷 통계, 사이드 배지, 컷별 문제 표시 */
function refreshCounters() {
  const p = App.project;
  if (!p) return;
  $$('[data-counter]').forEach((el) => {
    const key = el.dataset.counter;
    let m;
    if ((m = key.match(/^sub-(\d+)$/))) {
      const c = p.cuts[+m[1]]; if (!c) return;
      let sub = c.subtitle; [p.mode === 'promo' ? p.input.promo.disclaimer : '', p.settings.aiLabel ? p.settings.aiLabelText : ''].filter(Boolean).forEach((t) => { sub = sub.split(t).join(''); });
      const n = charCount(sub); const lim = Math.floor(App.prefs.cps * num(c.useSec));
      el.textContent = `${n}자 / 권장 ${lim}자 이내`; el.classList.toggle('over', n > lim);
    } else if ((m = key.match(/^nar-(\d+)$/))) {
      const c = p.cuts[+m[1]]; if (!c) return;
      const n = syllables(c.narration.replace(/^[^:：]{1,12}[:：]\s*/, '')); const lim = Math.floor(App.prefs.sps * num(c.useSec));
      el.textContent = `${n}음절 / 권장 ${lim}음절 이내`; el.classList.toggle('over', n > lim);
    } else if ((m = key.match(/^mot-(\d+)$/))) {
      const c = p.cuts[+m[1]]; if (!c) return;
      const n = (c.motionPrompt.match(/[A-Za-z']+/g) || []).length;
      el.textContent = `${n}단어 / 권장 50단어 이내`; el.classList.toggle('over', n > 60);
    } else if (key === 'source') {
      el.textContent = `${p.input.lecture.source.length.toLocaleString()}자`;
    }
  });
}
function refreshLive() {
  const p = App.project;
  if (!p) return;
  // 사이드바 상태 갱신(포커스 영향 없음)
  const side = $('.side-scroll');
  if (side) {
    const items = runChecks(p, App.prefs);
    const tmp = document.createElement('div');
    const errs = items.filter((i) => i.level === 'err').length;
    const warns = items.filter((i) => i.level === 'warn').length;
    STEPS.forEach((s) => {
      const btn = side.querySelector(`[data-view="${s.id}"]`);
      if (!btn) return;
      const st = stepStatus(p, s.id);
      btn.classList.remove('done', 'stale', 'todo'); btn.classList.add(st);
      const numEl = btn.querySelector('.nav-num'); if (numEl) numEl.textContent = st === 'done' ? '✓' : s.n;
      const old = btn.querySelector('.badge'); if (old) old.remove();
      const badge = stepBadge(p, s.id, st, errs, warns);

    });
    if (App.view === 'cuts') {
      const stats = $('#cut-stats'); if (stats) stats.innerHTML = cutStatsHTML(p, items);
      p.cuts.forEach((c, i) => {
        const box = document.querySelector(`[data-issues="${i}"]`);
        if (box) box.innerHTML = cutIssuesHTML(items.filter((x) => x.group !== '이미지·모션'), i);
        const range = document.querySelector(`[data-range="${i}"]`);

/* ---------- 3. 구성안 ---------- */
function quoteMatch(p, quote) {
  const q = normCmp(quote); if (!q) return ['warn', '근거 없음'];
  const src = normCmp(p.input.lecture.source);
  if (src.includes(q)) return ['ok', '원고 일치'];
  const r = shingleOverlap(q, src);
  return r >= 0.6 ? ['info', `일부 일치 ${Math.round(r * 100)}%`] : ['warn', `원고에 없음 ${Math.round(r * 100)}%`];
}

}

/* ---------- 4. 컷 시트 ---------- */
function cutRangeText(p, i) {
  let t = 0; for (let k = 0; k < i; k++) t += num(p.cuts[k].useSec);
  return `${round1(t)}~${round1(t + num(p.cuts[i].useSec))}초`;
}
function cutStatsHTML(p, items) {
  const T = p.settings.duration; const tol = num(App.prefs.tolerance, 1);
  const use = round1(sum(p.cuts.map((c) => num(c.useSec))));
  const ren = round1(sum(p.cuts.map((c) => num(c.renderSec))));
  const errs = items.filter((i) => i.level === 'err').length;
  const warns = items.filter((i) => i.level === 'warn').length;
  const L = allowedLengths(p);
  return `<span class="stat">컷 <b>${p.cuts.length}</b>개</span>
    <span class="stat ${Math.abs(use - T) <= tol ? 'good' : 'bad'}">사용 합계 <b>${use}</b> / ${T}초</span>
    ${L.length ? `<span class="stat ${ren >= T ? '' : 'bad'}">렌더 합계 <b>${ren}</b>초</span>` : ''}
    <span class="stat">${errs ? `<span class="badge err">오류 ${errs}</span>` : ''} ${warns ? `<span class="badge warn">경고 ${warns}</span>` : ''} ${!errs && !warns ? '<span class="badge ok">문제 없음</span>' : ''}</span>`;
}
function ratioHelp(p) {
  const suf = ratioSuffixLabel(p);
  return suf ? `복사·내보내기 시 자동 추가: <span class="mono ratio-suffix">${esc(suf)}</span>` : `<span class="req">비율 표기 없음</span> — 생성 도구에서 ${esc(p.settings.ratio)}를 직접 선택하십시오.`;
}
function cutIssuesHTML(items, i) {
  return items.filter((x) => x.cut === i).map((x) => `<span class="badge ${LV[x.level][0]}" title="${esc(x.text)}">${LV[x.level][1]} · ${esc(x.text.length > 46 ? x.text.slice(0, 45) + '…' : x.text)}</span>`).join('');
}

        <span class="mini" data-range="${i}">${cutRangeText(p, i)}</span>
        <span class="cut-summary" data-summary="${i}">${c.collapsed ? esc(c.subtitle || c.scene) : ''}</span>
        <span class="row" style="gap:2px;margin-left:auto;flex-wrap:nowrap">
          <button class="btn xs ghost" data-act="moveCut" data-idx="${i}" data-dir="-1" title="위로" ${i === 0 ? 'disabled' : ''}>↑</button>
          <button class="btn xs ghost" data-act="moveCut" data-idx="${i}" data-dir="1" title="아래로" ${i === p.cuts.length - 1 ? 'disabled' : ''}>↓</button>
          <button class="btn xs ghost" data-act="dupCut" data-idx="${i}">복제</button>

        </div>

          ${fText('내레이션', `cuts.${i}.narration`, c.narration, { rows: 2, counter: `nar-${i}` })}
          ${fText('자막', `cuts.${i}.subtitle`, c.subtitle, { rows: 2, counter: `sub-${i}` })}
        </div>
        ${fText(`이미지 프롬프트 <span class="badge info">${esc(p.settings.ratio)}</span><span class="spacer"></span><button class="btn xs accent" data-act="copyImagePrompt" data-idx="${i}">비율 포함 복사</button>`, `cuts.${i}.imagePrompt`, c.imagePrompt, { mono: true, rows: 3, span2: true, cls: 'prompt-field', lblCls: 'lbl row', help: ratioHelp(p) })}
        <div class="span2 help">모션 프롬프트는 <a href="#" data-act="gotoFrame" data-idx="${i}">5단계 이미지·모션</a>에서 실제 생성한 이미지를 보고 작성합니다.${c.motionPrompt ? ` 현재: <span class="mono">${esc(c.motionPrompt.length > 90 ? c.motionPrompt.slice(0, 89) + '…' : c.motionPrompt)}</span>` : ''}</div>
      </div>

  return `<div class="page">
    ${pageHead('4. 컷 시트', '컷마다 장면·프롬프트·내레이션·자막·길이를 설계합니다. 모든 칸을 직접 고칠 수 있습니다.', aiBtn('cuts', 'AI로 전체 다시 만들기', ''))}
    <div class="summary-bar">
      <div class="row"><div class="stats" id="cut-stats">${cutStatsHTML(p, items)}</div><div class="spacer"></div>
        <button class="btn sm" data-act="fix" data-fix="autoUse" title="내레이션 분량에 비례하여 목표 길이에 맞춥니다">사용 길이 자동 배분</button>
        ${L.length ? '<button class="btn sm" data-act="fix" data-fix="snapRender" title="사용 길이 이상인 가장 짧은 허용 길이로 맞춥니다">렌더 길이 맞춤</button>' : ''}
        <button class="btn sm ghost" data-act="collapseAll" data-val="${allCollapsed ? '0' : '1'}">${allCollapsed ? '모두 펼치기' : '모두 접기'}</button>
      </div>

    ${isCutsStale(p) ? '<div class="notice warn" style="margin:10px 0"><div>컷 시트를 만든 뒤 구성안 또는 제작 조건이 바뀌었습니다. 다시 만들거나, 직접 고친 뒤 확정하십시오.</div><div class="spacer"></div><button class="btn sm" data-act="fix" data-fix="ackCuts">현재 컷 시트로 확정</button></div>' : ''}
    <div style="margin-top:12px">${cards}</div>
    <div class="row"><button class="btn" data-act="addCut">+ 컷 추가</button></div>
    ${stepNav(['plan', '구성안'], '<button class="btn primary" data-act="go" data-view="frames">다음: 이미지·모션 →</button>')}

}


/* ---------- 5. 이미지·모션 ---------- */
function ratioOff(p, m) {
  if (!m || !m.w || !m.h) return false;
  const [rw, rh] = p.settings.ratio.split(':').map(Number);
  return Math.abs(m.w / m.h - rw / rh) / (rw / rh) > 0.08;
}
function frameSlot(p, c, i, kind) {
  const img = c[`${kind}Image`];
  const meta = c[`${kind}Meta`];
  const label = kind === 'start' ? '시작 프레임 <span class="req">*</span>' : '끝 프레임 <span class="help" style="font-weight:400">(선택)</span>';
  if (img) {
    const linked = kind === 'start' && i > 0 && p.cuts[i - 1].endImage && p.cuts[i - 1].endId === c.startId;
    return `<div class="frame-slot"><div class="lbl">${label}${linked ? ' <span class="badge info">앞 컷 끝 프레임 연결</span>' : ''}</div>
      <div class="frame-img" data-drop="1" data-idx="${i}" data-kind="${kind}" tabindex="0" title="새 이미지를 끌어다 놓거나, 누른 뒤 Ctrl+V로 교체"><img src="${img}" alt="CUT ${i + 1} ${kind === 'start' ? '시작' : '끝'} 프레임"></div>
      <div class="help" style="font-size:11px">${meta && meta.w ? `${meta.w}×${meta.h}` : ''}${meta && meta.name ? ` · ${esc(meta.name)}` : ''}${ratioOff(p, meta) ? ` <span class="badge warn">비율 다름(${esc(p.settings.ratio)} 아님)</span>` : ''}</div>
      <div class="row" style="gap:4px">
        <label class="btn xs">교체<input type="file" accept="image/png,image/jpeg,image/webp" class="hidden" data-file="frame" data-idx="${i}" data-kind="${kind}"></label>
        <button class="btn xs" data-act="copyImage" data-idx="${i}" data-kind="${kind}">복사</button>
        <button class="btn xs" data-act="saveImage" data-idx="${i}" data-kind="${kind}">저장</button>
        <button class="btn xs ghost danger" data-act="removeFrame" data-idx="${i}" data-kind="${kind}">삭제</button>
      </div></div>`;
  }
  return `<div class="frame-slot"><div class="lbl">${label}</div>
    <div class="dropzone" tabindex="0" data-drop="1" data-idx="${i}" data-kind="${kind}" role="button" aria-label="CUT ${i + 1} ${kind === 'start' ? '시작' : '끝'} 프레임 올리기">
      <b>이미지 올리기</b><span>끌어다 놓기 · 이 칸을 누른 뒤 Ctrl+V</span>
      <label class="btn xs" style="margin-top:6px">파일 선택<input type="file" accept="image/png,image/jpeg,image/webp" class="hidden" data-file="frame" data-idx="${i}" data-kind="${kind}"></label>
    </div>
    ${kind === 'end' && p.cuts[i + 1] ? '<div class="help" style="font-size:11px">올리면 다음 컷의 시작 프레임으로 연결됩니다.</div>' : ''}</div>`;
}
function reviewPanel(p, c, i, st) {
  const r = c.review;
  const L = allowedLengths(p);
  const motionField = fText(`${L.length ? '모션 프롬프트' : '편집기 움직임 효과'} <span class="spacer"></span><button class="btn xs" data-act="copyField" data-path="cuts.${i}.motionPrompt">복사</button>`, `cuts.${i}.motionPrompt`, c.motionPrompt, { mono: true, rows: 3, counter: `mot-${i}`, cls: 'prompt-field', lblCls: 'lbl row' });
  const textFields = `<div class="grid g2" style="gap:10px">${fText('내레이션', `cuts.${i}.narration`, c.narration, { rows: 2, counter: `nar-${i}` })}${fText('자막', `cuts.${i}.subtitle`, c.subtitle, { rows: 2, counter: `sub-${i}` })}</div>`;
  const obs = r && r.observed ? `<div class="help"><b>AI가 본 이미지:</b> ${esc(r.observed)}</div>` : '';
  const diffs = r && r.differences.length ? `<ul class="diff-list">${r.differences.map((d) => `<li>${esc(d)}</li>`).join('')}</ul>` : '';
  let head = '';
  if (st === 'noImage') {
    head = `<div class="notice info"><div>외부 이미지 생성 도구에서 왼쪽 <b>이미지 프롬프트</b>로 이미지를 만든 뒤 시작 프레임을 올리십시오.</div></div>`;
  } else if (st === 'needMotion') {
    head = `<div class="notice warn"><div>${r ? '이미지가 바뀌었습니다. 새 이미지를 보고 다시 작성하십시오.' : '이미지가 준비되었습니다. AI가 실제 이미지를 보고 모션 프롬프트를 작성합니다.'}</div><div class="spacer"></div>
      <button class="btn sm accent" data-act="ai" data-task="motion" data-idx="${i}">이미지 보고 모션 작성</button></div>
      <div class="row" style="margin-top:6px"><span class="help">AI 없이 아래 모션 프롬프트를 직접 썼다면</span><button class="btn xs" data-act="motionManual" data-idx="${i}">직접 작성으로 확정</button></div>`;
  } else if (st === 'review') {
    head = `<div class="review-box ${r.match}">
      <div class="row"><span class="badge warn">기획과 ${MATCH_LV[r.match]}</span><span class="help">${fmtDate(r.at)} 검토</span></div>
      ${obs}${diffs}
      <div class="grid g2" style="gap:10px;margin-top:10px">
        <div class="option-card"><b>A. 현재 이미지로 진행</b><div class="help">AI가 이 이미지에 맞춰 쓴 모션 프롬프트와 보정된 내레이션·자막을 적용합니다.</div>
          <div class="mono small-pre">${esc(r.motionPrompt || '(모션 없음)')}</div>
          <button class="btn sm primary" data-act="motionDecide" data-idx="${i}" data-dec="proceed">현재 이미지로 진행</button></div>
        <div class="option-card"><b>B. 이미지 다시 만들기</b><div class="help">아래 수정안으로 이미지를 다시 생성해 올립니다. 이 컷의 이미지 프롬프트가 수정안으로 바뀝니다.</div>
          <div class="mono small-pre">${esc(r.revisedImagePrompt || c.imagePrompt)}</div>
          <div class="row" style="gap:6px"><button class="btn sm" data-act="motionDecide" data-idx="${i}" data-dec="regen">이미지 다시 만들기</button><button class="btn xs" data-act="copyImagePrompt" data-idx="${i}" data-src="revised">수정안 복사(비율 포함)</button></div></div>
      </div></div>`;
  } else if (st === 'regen') {
    head = `<div class="notice warn"><div><b>이미지 재생성 대기</b> — 이미지 프롬프트를 수정안으로 바꿨습니다. 새로 만든 이미지를 시작 프레임에 올리면 다시 작성할 수 있습니다.${diffs}</div><div class="spacer"></div>
      <div class="row" style="gap:4px;flex-direction:column;align-items:stretch"><button class="btn xs accent" data-act="copyImagePrompt" data-idx="${i}">프롬프트 복사(비율 포함)</button><button class="btn xs ghost" data-act="motionDecide" data-idx="${i}" data-dec="undoRegen">선택 취소</button></div></div>`;
  } else if (st === 'done') {
    const changed = r && r.before && (r.before.narration !== c.narration || r.before.subtitle !== c.subtitle);
    head = r && r.decision !== 'manual' ? `<div class="review-box done"><div class="row"><span class="badge ${r.match === 'match' ? 'ok' : 'info'}">${r.match === 'match' ? '기획과 일치' : `${MATCH_LV[r.match]} · 현재 이미지로 진행`}</span>
        <div class="spacer"></div><button class="btn xs ghost" data-act="ai" data-task="motion" data-idx="${i}">다시 작성</button></div>
        ${obs}${r.match !== 'match' ? diffs : ''}
        ${r.changeNote ? `<div class="help"><b>내레이션·자막 보정:</b> ${esc(r.changeNote)}</div>` : ''}
        ${changed ? `<div class="row"><span class="help">기획 원문: ${esc((r.before.narration || '').slice(0, 60))}</span><button class="btn xs" data-act="motionDecide" data-idx="${i}" data-dec="restoreText">기획 원문으로 되돌리기</button></div>` : ''}
      </div>` : `<div class="row"><span class="badge ok">직접 작성으로 확정</span><div class="spacer"></div><button class="btn xs ghost" data-act="ai" data-task="motion" data-idx="${i}">AI로 다시 작성</button></div>`;
  }
  return `${head}${st === 'review' ? '' : `<div style="margin-top:10px" class="grid">${motionField}${textFields}</div>`}`;
}
function viewFrames() {
  const p = App.project;
  if (!p.cuts.length) {
    return `<div class="page">${pageHead('5. 이미지·모션', '실제 생성한 이미지를 보고 모션 프롬프트를 작성합니다.')}
      <div class="card"><div class="empty"><h3>컷 시트가 먼저 필요합니다</h3><button class="btn primary" data-act="go" data-view="cuts">컷 시트로 이동</button></div></div></div>`;
  }
  const stages = p.cuts.map(cutStage);
  const cnt = {}; stages.forEach((x) => { cnt[x] = (cnt[x] || 0) + 1; });
  const pendingApi = stages.filter((x) => x === 'needMotion').length;
  const L = allowedLengths(p);
  const frameItems = runChecks(p, App.prefs).filter((x) => x.group === '이미지·모션' && x.level !== 'warn');
  const cards = p.cuts.map((c, i) => {
    const st = stages[i];
    const [cls, lbl] = STAGE_LABEL[st];
    return `<div class="cut frame-card" id="frame-${i}">
      <div class="cut-head"><span class="cut-no">CUT ${pad2(i + 1)}</span><span class="badge ${cls}">${lbl}</span>
        <span class="mini">${L.length ? `렌더 ${c.renderSec}초 · ` : ''}사용 ${c.useSec}초</span>
        <span class="cut-summary">${esc(c.scene)}</span></div>
      <div class="frame-body">
        <div class="frame-col">
          <div class="frame-pair">${frameSlot(p, c, i, 'start')}${frameSlot(p, c, i, 'end')}</div>
          <details class="plan-details" ${st === 'noImage' || st === 'regen' ? 'open' : ''}><summary>기획 내용 · 이미지 프롬프트</summary>
            <div class="help" style="margin:6px 0"><b>장면:</b> ${esc(c.scene) || '-'}<br><b>카메라 계획:</b> ${esc(c.camera) || '-'}${c.characters.length ? `<br><b>등장:</b> ${esc(c.characters.join(', '))}` : ''}</div>
            ${fText(`이미지 프롬프트 <span class="badge info">${esc(p.settings.ratio)}</span><span class="spacer"></span><button class="btn xs accent" data-act="copyImagePrompt" data-idx="${i}">비율 포함 복사</button>`, `cuts.${i}.imagePrompt`, c.imagePrompt, { mono: true, rows: 3, cls: 'prompt-field', lblCls: 'lbl row', help: ratioHelp(p) })}
          </details>
        </div>
        <div class="frame-col">${reviewPanel(p, c, i, st)}</div>
      </div>
      <div class="issues" data-issues="${i}">${cutIssuesHTML(frameItems, i)}</div>
    </div>`;
  }).join('');
  const via = App.prefs.aiMode === 'gemini';
  return `<div class="page">
    ${pageHead('5. 이미지·모션', '① 컷별 이미지 프롬프트로 외부 도구에서 이미지를 만들고 ② 시작 프레임(필수)·끝 프레임(선택)을 올리면 ③ AI가 실제 이미지를 보고 모션 프롬프트를 작성하고 기획과 다른 점을 알려 줍니다.',
      via ? `<button class="btn accent" data-act="motionBatch" ${pendingApi ? '' : 'disabled'}>작성 필요한 컷 일괄 작성 (${pendingApi}개)</button>` : '')}
    <div class="row" style="margin-bottom:12px">${Object.keys(STAGE_LABEL).filter((k) => cnt[k]).map((k) => `<span class="badge ${STAGE_LABEL[k][0]}">${STAGE_LABEL[k][1]} ${cnt[k]}</span>`).join('')}</div>
    ${via ? '' : '<div class="notice info" style="margin-bottom:12px"><div>붙여넣기 방식에서는 컷마다 <b>요청문과 이미지를 같은 대화에 함께</b> 넣습니다. 이미지를 첨부할 수 있는 챗봇(ChatGPT·Gemini·Claude 등)을 사용하십시오.</div></div>'}
    ${cards}
    ${stepNav(['cuts', '컷 시트'], '<button class="btn primary" data-act="go" data-view="checks">다음: 점검 →</button>')}
  </div>`;
}

/* ---------- 6. 점검 ---------- */
function viewChecks() {
  const p = App.project;
  const items = runChecks(p, App.prefs);
  const cnt = { err: 0, warn: 0, info: 0 }; items.forEach((i) => cnt[i.level]++);
  const manual = manualChecklist(p.mode);
  const doneManual = manual.filter((m) => p.manual[m.id]).length;
  const groups = {};
  items.forEach((it) => { (groups[it.group] = groups[it.group] || []).push(it); });
  const groupHTML = Object.entries(groups).map(([g, list]) => `<div class="card check-group"><div class="card-pad" style="padding-bottom:4px"><div class="section-title">${esc(g)} <span class="badge">${list.length}</span></div></div>
    ${list.map((it) => `<div class="check-item"><span class="badge ${LV[it.level][0]}">${LV[it.level][1]}</span>
      <div class="msg">${esc(it.text)}${it.cut != null ? `<div class="where"><a href="#" data-act="${it.step === 'frames' ? 'gotoFrame' : 'gotoCut'}" data-idx="${it.cut}">CUT ${pad2(it.cut + 1)}${it.step === 'frames' ? ' 이미지·모션' : ''}(으)로 이동</a></div>` : ''}${it.step && it.cut == null ? `<div class="where"><a href="#" data-act="go" data-view="${it.step}">${esc(STEPS.find((s) => s.id === it.step).label)}(으)로 이동</a></div>` : ''}</div>
      ${it.fix ? `<button class="btn sm" data-act="fix" data-fix="${it.fix.id}">${esc(it.fix.label)}</button>` : ''}</div>`).join('')}</div>`).join('');
  const rv = p.review;
  const review = `<div class="card card-pad">
    <div class="section-title">AI 교차 검토 <span class="badge">참고용</span></div>
    <div class="help" style="margin-bottom:10px">자동 점검은 숫자·문구 일치 같은 기계적 규칙만 확인합니다. 의미 왜곡·과장·흐름 문제는 다른 AI에게 검토자 역할을 맡겨 한 번 더 확인하십시오. 컷 시트를 만든 AI와 <b>다른 챗봇</b>을 쓰면 더 효과적입니다.</div>
    <div class="row">${aiBtn('review', rv ? 'AI 교차 검토 다시 실행' : 'AI 교차 검토 실행', '', p.cuts.length ? '' : 'disabled')}${rv ? `<span class="help">${fmtDate(rv.at)} 실행</span>` : ''}</div>
    ${rv ? `<div class="divider"></div>${rv.summary ? `<p style="margin-top:0">${esc(rv.summary)}</p>` : ''}${rv.issues.length ? rv.issues.map((i) => `<div class="check-item"><span class="badge ${i.level}">${i.level === 'warn' ? '경고' : '참고'}</span><div class="msg">${esc(i.text)}${i.cut ? `<div class="where"><a href="#" data-act="gotoCut" data-idx="${i.cut - 1}">CUT ${pad2(i.cut)}로 이동</a></div>` : ''}</div></div>`).join('') : '<div class="notice ok">검토 AI가 지적한 문제가 없습니다.</div>'}` : ''}
  </div>`;
  return `<div class="page">
    ${pageHead('6. 점검', '점검 결과는 내보내기를 막지 않습니다. 다만 오류는 제작 전에 해소하고, 남은 항목은 제작 지시서에 기록됩니다.')}
    <div class="score" style="margin-bottom:14px">
      <div class="box err"><span class="help">오류</span><b>${cnt.err}</b></div>
      <div class="box warn"><span class="help">경고</span><b>${cnt.warn}</b></div>
      <div class="box info"><span class="help">참고</span><b>${cnt.info}</b></div>
      <div class="box ${doneManual === manual.length ? 'ok' : ''}"><span class="help">담당자 확인</span><b>${doneManual}/${manual.length}</b></div>
    </div>
    ${items.length ? groupHTML : '<div class="card"><div class="empty"><h3>자동 점검에서 발견된 문제가 없습니다</h3>아래 담당자 확인 사항을 점검하십시오.</div></div>'}
    ${review}
    <div class="card card-pad"><div class="section-title">담당자 확인 사항</div>
      <div class="help" style="margin-bottom:10px">기계가 판단할 수 없는 항목입니다. 확인한 항목에 표시하면 제작 지시서에 반영됩니다.</div>
      <div class="grid" style="gap:10px">${manual.map((m) => fCheck(esc(m.text), `manual.${m.id}`, !!p.manual[m.id], { rerender: 1 })).join('')}</div>
    </div>
    ${stepNav(['frames', '이미지·모션'], '<button class="btn primary" data-act="go" data-view="export">다음: 내보내기 →</button>')}
  </div>`;
}

/* ---------- 7. 내보내기 ---------- */
function viewExport() {
  const p = App.project;
  const items = runChecks(p, App.prefs);
  const errs = items.filter((i) => i.level === 'err').length;
  const warns = items.filter((i) => i.level === 'warn').length;
  const base = fileBase(p);
  const noCuts = !p.cuts.length;
  const dis = noCuts ? 'disabled' : '';
  const card = (title, desc, file, buttons) => `<div class="card card-pad export-card"><h3>${title}</h3><div class="help">${desc}</div>${file ? `<div class="help mono" style="font-size:11.5px">${esc(file)}</div>` : ''}<div class="row">${buttons}</div></div>`;
  return `<div class="page">
    ${pageHead('7. 내보내기', '다음 작업 도구에 바로 넣을 수 있는 형식으로 저장합니다. 파일 이름은 모두 영문입니다.')}
    ${errs || warns ? `<div class="notice ${errs ? 'err' : 'warn'}" style="margin-bottom:14px"><div>해소되지 않은 오류 ${errs}건, 경고 ${warns}건이 있습니다. 제작 지시서에 함께 기록됩니다.</div><div class="spacer"></div><button class="btn sm" data-act="go" data-view="checks">점검으로 이동</button></div>` : p.cuts.length ? '<div class="notice ok" style="margin-bottom:14px">자동 점검에서 오류·경고가 없습니다.</div>' : ''}
    ${noCuts ? '<div class="notice warn" style="margin-bottom:14px">컷 시트가 비어 있어 대부분의 파일을 만들 수 없습니다.</div>' : ''}
    <div class="export-grid">
      ${card('자막 파일 (SRT)', 'Vrew·캡컷·프리미어 등에서 자막 파일로 불러옵니다. 각 컷의 사용 길이에 따라 시간이 배정됩니다.', `${base}_subtitles.srt`, `<button class="btn primary" data-act="exportSRT" ${dis}>자막 SRT</button><button class="btn" data-act="exportSRTNarr" ${dis}>내레이션 SRT</button>`)}
      ${card('내레이션 원고 (TXT)', 'Vrew의 AI 목소리 등 음성 합성 도구에 붙여 넣을 원고입니다. 컷 순서대로 문단을 나눕니다.', `${base}_narration.txt`, `<button class="btn primary" data-act="exportNarration" ${dis}>원고 TXT</button>`)}
      ${card('컷별 생성 프롬프트 (TXT)', '컷별 이미지 프롬프트, 프레임 파일 이름, 이미지 기반 모션 프롬프트를 정리합니다. Flow 등 영상 생성 도구에 컷별로 붙여 넣습니다.', `${base}_prompts.txt`, `<button class="btn primary" data-act="exportPrompts" ${dis}>프롬프트 TXT</button><span class="help">이미지 프롬프트에 ${esc(p.settings.ratio)} 비율 표기 포함</span>`)}
      ${card('컷 시트 (CSV)', '엑셀에서 열어 검토·공유합니다. 한글이 깨지지 않도록 저장했습니다.', `${base}_cutsheet.csv`, `<button class="btn primary" data-act="exportCSV" ${dis}>컷 시트 CSV</button>`)}
      ${card('제작 지시서 (PDF)', '업로드한 시작 프레임이 들어간 스토리보드 형식의 보고·결재·협업용 문서입니다. 인쇄 창에서 대상을 <b>"PDF로 저장"</b>으로 선택하십시오.', `${base}_brief.pdf`, '<button class="btn primary" data-act="printDoc">인쇄·PDF 저장</button>')}
      ${card('프로젝트 백업 (JSON)', '다른 PC로 옮기거나 보관합니다. 홈 화면의 "프로젝트 가져오기"로 복원합니다. 업로드한 이미지(압축본)가 포함되며, API 키는 포함되지 않습니다.', `${base}_project.json`, '<button class="btn primary" data-act="exportJSON">백업 JSON</button>')}
    </div>
    ${stepNav(['checks', '점검'])}
  </div>`;
}

async function runGemini(m) {

    const c = normCut(raw);
    const old = p.cuts[extra.idx];
    if (!old) throw new Error('대상 컷을 찾을 수 없습니다.');
    if (!c.scene && !c.imagePrompt && !c.narration) throw new Error('컷 내용이 비어 있습니다.');
    setUndo(`CUT ${extra.idx + 1} 다시 쓰기`);

    c.motionPrompt = old.motionPrompt;

    if (!(c.useSec > 0)) c.useSec = old.useSec;

    else toast(`CUT ${pad2(idx + 1)} 모션 프롬프트를 작성했습니다.${r.changeNote ? ' 내레이션·자막도 보정했습니다.' : ''}`, 'ok', 8000, undoToastAction());
  } else if (task === 'review') {

  }
}

function applyMotionResult(idx, parsed, noUndo) {
  const p = App.project;
