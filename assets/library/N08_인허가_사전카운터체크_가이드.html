<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인허가 민원 '3분 사전 카운터 체크' 가이드</title>
<style>
  :root{
    --navy:#1a3a6b; --navy-d:#122b50; --blue:#2f6fd1; --blue-l:#eaf1fb;
    --gray:#f5f6f8; --line:#d9dee6; --text:#222; --sub:#6b7684;
    --green:#1f8a4c; --green-l:#e8f6ee; --amber:#d68910; --amber-l:#fdf3e3; --red:#c0392b; --red-l:#fdecea;
    --purple:#6a3fc0;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Malgun Gothic','맑은 고딕',Apple SD Gothic Neo,sans-serif; background:var(--gray); color:var(--text);}
  header{background:var(--navy); color:#fff; padding:18px 28px; display:flex; align-items:center; gap:14px;}
  header .badge{background:var(--purple); font-size:12px; padding:4px 10px; border-radius:20px; font-weight:700;}
  header h1{font-size:20px; font-weight:700;}
  header p{font-size:12px; opacity:.75; margin-top:3px;}
  .notice{background:var(--amber-l); border-bottom:1px solid #f0dcb4; padding:9px 28px; font-size:12px; color:#7a5b13; line-height:1.6;}
  .top-bar{background:#fff; border-bottom:1px solid var(--line); padding:10px 28px; display:flex; gap:10px; align-items:center; font-size:13px; flex-wrap:wrap;}
  .top-bar label{font-weight:700; color:var(--navy); font-size:12.5px;}
  .top-bar input{padding:7px 11px; border:1px solid var(--line); border-radius:6px; font-size:13px; font-family:inherit; width:170px;}
  .container{max-width:1150px; margin:0 auto; padding:22px 28px 60px;}
  /* 업종 대형 버튼 */
  .biz-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px;}
  .biz{background:#fff; border:2px solid var(--line); border-radius:16px; padding:20px 10px; text-align:center; cursor:pointer; transition:.15s;}
  .biz:hover{border-color:var(--blue); transform:translateY(-2px); box-shadow:0 6px 16px rgba(26,58,107,.10);}
  .biz.on{border-color:var(--navy); background:var(--blue-l); box-shadow:0 6px 16px rgba(26,58,107,.14);}
  .biz .ic{font-size:36px;}
  .biz .nm{font-size:15px; font-weight:900; color:var(--navy); margin-top:8px; word-break:keep-all;}
  .biz .lw{font-size:10.5px; color:var(--sub); margin-top:3px;}
  /* 결과 */
  .result{display:none;}
  .head-strip{background:var(--navy); color:#fff; border-radius:14px; padding:16px 22px; display:flex; align-items:center; gap:14px; margin-bottom:16px; flex-wrap:wrap;}
  .head-strip .ic{font-size:32px;}
  .head-strip h2{font-size:18px;}
  .head-strip .law{font-size:11.5px; opacity:.8; margin-top:3px;}
  .head-strip .period{margin-left:auto; background:rgba(255,255,255,.15); border-radius:10px; padding:8px 16px; font-size:12.5px; font-weight:700; text-align:center;}
  .cols{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .card{background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden;}
  .card-h{padding:11px 16px; font-size:14px; font-weight:900; display:flex; justify-content:space-between; align-items:center;}
  .ch-stop{background:var(--red-l); color:var(--red);}
  .ch-doc{background:var(--blue-l); color:var(--navy);}
  .ch-warn{background:var(--amber-l); color:var(--amber);}
  .card-b{padding:12px 16px;}
  .chk{display:flex; gap:10px; align-items:flex-start; padding:8px 4px; font-size:14px; line-height:1.6; cursor:pointer; border-radius:7px;}
  .chk:hover{background:var(--blue-l);}
  .chk input{margin-top:4px; width:17px; height:17px; accent-color:var(--green); flex-shrink:0;}
  .chk.done span{color:var(--sub); text-decoration:line-through;}
  .chk .why{display:block; font-size:11.5px; color:var(--sub); margin-top:2px;}
  .prog{font-size:12px; font-weight:800;}
  .rej{padding:8px 4px; font-size:13.2px; line-height:1.65; word-break:keep-all;}
  .rej b{color:var(--red);}
  .stop-note{font-size:11.5px; color:var(--red); font-weight:700; padding:6px 16px 12px;}
  /* 액션 버튼 */
  .actions{display:flex; gap:10px; margin-top:16px;}
  .abtn{flex:1; border:none; border-radius:10px; padding:15px 0; font-size:15px; font-weight:800; cursor:pointer; font-family:inherit; color:#fff;}
  .a-kakao{background:#fee500; color:#3c1e1e;}
  .a-kakao:hover{background:#f5d900;}
  .a-print{background:var(--navy);}
  .a-print:hover{background:var(--navy-d);}
  .a-back{background:#fff; color:var(--sub); border:1px solid var(--line); flex:0 0 130px;}
  /* 인쇄용 안내장 */
  #printDoc{display:none;}
  @media print{
    header,.notice,.top-bar,.container>.biz-grid,.result,#toast{display:none!important;}
    #printDoc{display:block; font-size:13.5px; line-height:1.9; padding:10px;}
    #printDoc .pd-title{text-align:center; font-size:20px; font-weight:900; letter-spacing:3px; margin-bottom:6px;}
    #printDoc .pd-sub{text-align:center; font-size:12px; color:#555; margin-bottom:18px;}
    #printDoc h3{font-size:14.5px; margin:16px 0 8px; padding-left:8px; border-left:4px solid #1a3a6b;}
    #printDoc li{margin-left:22px; margin-bottom:4px;}
    #printDoc .pd-foot{margin-top:22px; padding-top:10px; border-top:1px dashed #999; font-size:12.5px; color:#444;}
    body{background:#fff;}
  }
  #toast{position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#222; color:#fff; padding:11px 22px; border-radius:30px; font-size:13.5px; opacity:0; transition:.3s; pointer-events:none; z-index:99;}
  #toast.show{opacity:1;}
  @media (max-width:900px){ .biz-grid{grid-template-columns:1fr 1fr;} .cols{grid-template-columns:1fr;} }
</style>
</head>

<header>

  <div>

  </div>
</header>
<div class="notice">⚠️ 구비 서류·제한 기준은 <b>일반적인 기준의 교육용 예시</b>입니다. 지역 조례·건축물 상황에 따라 달라질 수 있으므로, 안내 전 소관 법령·부서 지침으로 확인하세요. (정부24·인허가 자가진단 병행 권장)</div>

<script>
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  stop:[

  ],

  reject:[['면허 없이 신고 시도','면허 취득이 선행 조건'],['위생교육 미이수','사전 온라인 이수'],['미신고 셰어숍 운영','1개 영업장 내 별도 영업은 각자 신고 필요']]},

  stop:[

   ['시설 면적이 기준(단위 면적)을 충족하는가?','교습 인원 대비 면적 기준 — 교육지원청 기준 확인'],
   ['소방·안전 기준을 충족하는가?','일정 규모 이상은 소방시설 완비 필요']
  ],
  docs:['학원 등록신청서 (교육지원청)','운영계획서·원칙(규정)','강사 자격 증빙 서류','시설 평면도','임대차계약서','건축물대장'],
  reject:[['동일 건물 유해업소','계약 전 건물 전체 입점 현황 확인 필수'],['면적 기준 미달','교습 과정별 기준이 다름'],['접수 기관 혼동','학원은 시청이 아니라 교육지원청 소관']]},

 karaoke:{ic:'🎤', name:'노래연습장', law:'음악산업진흥법 제18조 (등록)', period:'약 7일',
  stop:[

   ['소방시설 등 완비증명을 받을 수 있는 구조인가?','소방서 완비증명 필수 — 구조 변경 부담 확인'],
   ['건축물 용도·위반 여부 확인했는가?','건축물대장 확인']
  ],
  docs:['등록신청서','소방시설 등 완비증명서','건축물대장','임대차계약서','신분증'],
  reject:[['교육환경보호구역','계약 전 학교 거리부터 — 가장 흔한 낭패'],['소방 완비증명 미비','방음 공사 전에 소방 협의 먼저'],['청소년 출입시간 위반 운영','등록 후 단속 다발 사항 사전 안내']]},

  reject:[['용도지역 불허','토지 계약 전 토지이용계획확인원이 필수 0순위'],['환경 인허가 누락','공장 승인과 별개로 배출시설 신고 필요'],['처리 기간 오해','타 인허가 의제 협의로 기간이 길어질 수 있음 사전 안내']]}
};

/* ---------- 업종 버튼 ---------- */
document.getElementById('bizGrid').innerHTML=Object.entries(BIZ).map(([k,b])=>`
 <div class="biz" id="biz-${k}" onclick="pick('${k}')">
   <div class="ic">${b.ic}</div>
   <div class="nm">${b.name}</div>
   <div class="lw">${b.law.split(' ')[0]}</div>
 </div>`).join('');

let CUR=null;
function pick(k){
  CUR=k;
  document.querySelectorAll('.biz').forEach(el=>el.classList.remove('on'));
  document.getElementById('biz-'+k).classList.add('on');
  const b=BIZ[k];
  const r=document.getElementById('result');
  r.style.display='block';
  r.innerHTML=`
  <div class="head-strip">
    <span class="ic">${b.ic}</span>
    <div><h2>${b.name}</h2><div class="law">⚖️ ${b.law}</div></div>
    <div class="period">표준 처리<br>${b.period}</div>
  </div>
  <div class="cols">
    <div class="card">
      <div class="card-h ch-stop">🚫 STOP! 입지·건물 먼저 확인 <span class="prog" id="stopProg">0/${b.stop.length}</span></div>
      <div class="card-b">
        ${b.stop.map((s,i)=>`<label class="chk" id="st-${i}"><input type="checkbox" onchange="tick('st',${i},${b.stop.length},'stopProg')"><span><b>${esc(s[0])}</b><span class="why">${esc(s[1])}</span></span></label>`).join('')}
      </div>
      <div class="stop-note">※ 위 항목에서 하나라도 "아니오"면 서류 접수 전에 해결이 필요합니다 — 여기서 걸러야 재방문 민원이 없습니다.</div>
    </div>
    <div>
      <div class="card" style="margin-bottom:14px;">
        <div class="card-h ch-doc">📄 필수 구비 서류 <span class="prog" id="docProg">0/${b.docs.length}</span></div>
        <div class="card-b">
          ${b.docs.map((d,i)=>`<label class="chk" id="dc-${i}"><input type="checkbox" onchange="tick('dc',${i},${b.docs.length},'docProg')"><span>${esc(d)}</span></label>`).join('')}
        </div>
      </div>
      <div class="card">
        <div class="card-h ch-warn">⚠️ 자주 반려되는 사유 TOP ${b.reject.length}</div>
        <div class="card-b">
          ${b.reject.map((rj,i)=>`<div class="rej">${i+1}. <b>${esc(rj[0])}</b> — ${esc(rj[1])}</div>`).join('')}
        </div>
      </div>
    </div>
  </div>
  <div class="actions">
    <button class="abtn a-back" onclick="back()">← 업종 다시</button>
    <button class="abtn a-kakao" onclick="copyKakao()">💬 민원인 카톡용 안내문 복사</button>
    <button class="abtn a-print" onclick="printDoc()">🖨 안내장 인쇄</button>
  </div>`;
  r.scrollIntoView({behavior:'smooth'});
  toast(`${b.name} 체크 가이드가 열렸습니다. 민원인과 함께 STOP 항목부터 확인하세요.`);
}

function tick(prefix,i,total,progId){
  const el=document.getElementById(prefix+'-'+i);
  el.classList.toggle('done', el.querySelector('input').checked);
  const done=[...document.querySelectorAll(`[id^="${prefix}-"] input`)].filter(c=>c.checked).length;
  document.getElementById(progId).textContent=`${done}/${total}`;
  if(prefix==='dc'&&done===total) toast('🎉 서류가 모두 준비되었습니다 — 접수 가능!');
}

function back(){
  document.getElementById('result').style.display='none';
  document.querySelectorAll('.biz').forEach(el=>el.classList.remove('on'));
  CUR=null;
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------- 카톡 안내문 ---------- */
function contact(){
  const org=document.getElementById('org').value.trim()||'○○시청';
  const dept=document.getElementById('dept').value.trim();
  const tel=document.getElementById('tel').value.trim();
  return {org, line:`${org}${dept?' '+dept:''}${tel?' ☎ '+tel:''}`};
}
function copyKakao(){
  if(!CUR) return;
  const b=BIZ[CUR], c=contact();
  const txt=`[${c.org}] ${b.name} 인허가 준비 안내

안녕하세요! 방문 전 아래 내용을 확인하시면 한 번에 처리하실 수 있습니다.

🚫 계약·방문 전 꼭 확인하세요
${b.stop.map(s=>`· ${s[0]}\n  (${s[1]})`).join('\n')}

📄 가져오실 서류
${b.docs.map(d=>`□ ${d}`).join('\n')}

⚠️ 이런 경우 반려될 수 있어요
${b.reject.map(r=>`· ${r[0]} — ${r[1]}`).join('\n')}

⏱ 표준 처리 기간: ${b.period}
⚖️ 근거: ${b.law}

궁금하신 점은 ${c.line}으로 문의해 주세요.
※ 건물·지역 상황에 따라 추가 서류가 필요할 수 있습니다.`;
  navigator.clipboard.writeText(txt).then(()=>toast('💬 안내문이 복사되었습니다 — 카카오톡·문자로 붙여넣어 전송하세요.')).catch(()=>toast('⚠️ 복사 실패'));
}

/* ---------- 인쇄 안내장 ---------- */
function printDoc(){
  if(!CUR) return;
  const b=BIZ[CUR], c=contact();
  const today=new Date();
  document.getElementById('printDoc').innerHTML=`
  <div class="pd-title">${esc(b.name)} 인허가 준비 안내</div>
  <div class="pd-sub">${esc(c.org)} · 발급일 ${today.getFullYear()}. ${today.getMonth()+1}. ${today.getDate()}.</div>
  <h3>🚫 계약·공사 전 반드시 확인할 사항</h3>
  <ul>${b.stop.map(s=>`<li><b>${esc(s[0])}</b><br><span style="color:#555; font-size:12px;">${esc(s[1])}</span></li>`).join('')}</ul>
  <h3>📄 준비 서류 체크리스트</h3>
  <ul>${b.docs.map(d=>`<li>☐ ${esc(d)}</li>`).join('')}</ul>
  <h3>⚠️ 자주 반려되는 사유</h3>
  <ul>${b.reject.map(r=>`<li><b>${esc(r[0])}</b> — ${esc(r[1])}</li>`).join('')}</ul>
  <div class="pd-foot">
    ⚖️ 근거: ${esc(b.law)} &nbsp;|&nbsp; ⏱ 표준 처리 기간: ${esc(b.period)}<br>
    문의: ${esc(c.line)}<br>
    ※ 본 안내는 일반 기준이며, 건물·지역 상황에 따라 추가 서류·절차가 필요할 수 있습니다.
  </div>`;
  window.print();
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),2800);
}
</script>
</body>
</html>
