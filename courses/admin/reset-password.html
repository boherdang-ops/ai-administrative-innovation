<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>CMS 비밀번호 재설정</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="admin.css"></head>
<body><main class="login-card"><p class="eyebrow">AI행정혁신연구소</p><h1>CMS 비밀번호 재설정</h1><p>이메일 계정과 GitHub의 비밀번호는 변경되지 않습니다. 같은 관리자 계정을 쓰는 포트폴리오·러닝 허브·교육과정 CMS에는 새 비밀번호가 적용됩니다.</p>
<p id="status" role="status" aria-live="polite"></p>
<form id="request-form"><label>CMS 관리자 이메일<input id="email" type="email" autocomplete="username" required></label><button class="primary" type="submit">재설정 메일 보내기</button><p class="hint">받은 메일의 링크를 열면 새 비밀번호를 설정할 수 있습니다.</p></form>
<form id="update-form" hidden><label>새 CMS 비밀번호<input id="password" type="password" autocomplete="new-password" minlength="12" required></label><label>새 비밀번호 확인<input id="confirm-password" type="password" autocomplete="new-password" minlength="12" required></label><p class="hint">12자 이상으로 입력하세요. 이메일 계정 비밀번호와 다르게 정하는 것을 권장합니다.</p><button class="primary" type="submit">새 비밀번호로 변경</button></form>
<p><a class="button" href="./">CMS 로그인으로 돌아가기</a></p></main><script src="../config.js"></script>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),cfg=window.COURSE_SUPABASE;let recoveryToken='',busy=false;const hash=new URLSearchParams(location.hash.slice(1));history.replaceState(null,'',location.pathname);const message=t=>{$('status').textContent=t;};
async function api(path,body,token,method='POST'){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{const r=await fetch(cfg.url+'/auth/v1/'+path,{method,signal:controller.signal,headers:{apikey:cfg.anonKey,'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(body===undefined?{}:{body:JSON.stringify(body)})});const text=await r.text();let data={};try{data=text?JSON.parse(text):{}}catch{}if(!r.ok)throw Error(data.msg||data.message||data.error_description||'요청을 완료하지 못했습니다.');return data;}catch(e){if(e.name==='AbortError')throw Error('연결 시간이 초과되었습니다. 잠시 후 다시 시도하세요.');throw e}finally{clearTimeout(timer)}}
async function run(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn()}catch(e){message(e.message)}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
if(!cfg?.url||!cfg?.anonKey){message('CMS 연결 설정을 찾을 수 없습니다.');$('request-form').hidden=true;return;}
$('request-form').onsubmit=e=>{e.preventDefault();run(async()=>{await api('recover?redirect_to='+encodeURIComponent(location.origin+location.pathname),{email:$('email').value.trim()});message('등록된 이메일이면 재설정 메일이 발송됩니다. 받은편지함과 스팸함을 확인하고 가장 최근 메일의 링크를 열어 주세요.');})};
$('update-form').onsubmit=e=>{e.preventDefault();run(async()=>{const password=$('password').value;if(password.length<12)throw Error('새 비밀번호는 12자 이상이어야 합니다.');if(password!==$('confirm-password').value)throw Error('두 비밀번호가 일치하지 않습니다.');if(!recoveryToken)throw Error('재설정 메일의 링크를 다시 열어 주세요.');await api('user',{password},recoveryToken,'PUT');try{await api('logout?scope=global',undefined,recoveryToken)}catch{}recoveryToken='';$('password').value='';$('confirm-password').value='';sessionStorage.removeItem('course.auth');$('update-form').hidden=true;message('CMS 비밀번호를 변경했습니다. CMS 로그인으로 돌아가 새 비밀번호로 로그인하세요.');})};
if(hash.get('error')){message('재설정 링크가 만료되었거나 유효하지 않습니다. 새 메일을 요청하세요.');return;}
if(hash.get('access_token')&&hash.get('type')==='recovery'){recoveryToken=hash.get('access_token');$('request-form').hidden=true;message('재설정 링크를 확인하고 있습니다.');run(async()=>{try{await api('user',undefined,recoveryToken,'GET');$('update-form').hidden=false;message('이메일 확인이 완료되었습니다. 새 CMS 비밀번호를 직접 입력하세요.');}catch(e){recoveryToken='';$('request-form').hidden=false;throw Error('재설정 링크를 확인하지 못했습니다. 새 메일을 요청하세요.');}});}
})();
</script></body></html>
